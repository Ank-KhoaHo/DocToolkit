version: 2

# Automated dependency updates. This repo's whole premise is that the RESOLVED
# dependency graph satisfies four constraints at once - permissive licences,
# NuGet only, Linux-safe, no runtime network I/O - and that a single upstream
# bump can break any of them silently. ci.yml's premise guards already
# adjudicate a change once someone makes it; this file is what proposes them.
#
# Lockfiles exist on
# src/ only, and why each ignore rule below is where it is.
#
# PRs land on main, the default branch. There is deliberately no target-branch:
# setting it would suppress Dependabot security updates, which GitHub raises on
# the default branch only. An earlier revision needed target-branch: develop
# while the two-branch model existed, and paid exactly that cost.

updates:
  # ── The core library ────────────────────────────────────────────────────────
  # Its own block: SixLabors.Fonts is a direct reference only here, so the ignore
  # rule has to attach to the project it actually applies to.
  - package-ecosystem: nuget
    directory: "/src/DocToolkit"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    open-pull-requests-limit: 10
    ignore:
      # 2.x moves to the Six Labors Split License - Apache-2.0 only under $1M
      # annual revenue. The exact-version 1.0.x pin is the licensing wall. Blocking the major
      # here stops a doomed PR reopening every week; ci.yml's premise guard stays
      # the backstop if anything ever slips past.
      - dependency-name: "SixLabors.Fonts"
        update-types: ["version-update:semver-major"]
      # Everything else here too, and not because these dependencies do not matter.
      # Dependabot cannot write a correct lockfile for a MULTI-TARGETED project: measured
      # twice on 2026-08-03, it rewrote this project's 256-line lockfile down to 6, deleting
      # both the net8.0 and net10.0 sections, and every such PR then dies on NU1004.
      #
      # So a bump proposed here can never merge. The PR is not a risk - the locked-mode guard
      # catches it every time - it is pure review cost for an artefact that is always broken.
      # What was actually wanted is the INFORMATION, which dependency-report.yml now delivers
      # as a read-only weekly summary instead. Bumps here stay a deliberate manual act.
      #
      # SECURITY UPDATES ARE AFFECTED TOO - an ignore condition suppresses Dependabot's
      # security PRs for the named dependency, not only its version-update PRs. That is
      # accepted here rather than overlooked, for one reason: a security PR for these
      # projects would arrive with the same corrupted lockfile and be equally unmergeable,
      # so no working automation is being given up.
      #
      # What is NOT suppressed is the Dependabot ALERT. Alerts come from the dependency
      # graph and ignore this file entirely, so a vulnerability in a shipped dependency
      # still surfaces in the Security tab. The bump is then made by hand - which it had
      # to be anyway.
      - dependency-name: "*"

  # ── The extensions package ──────────────────────────────────────────────────
  # Every reference here is a FLOOR, and raising a floor narrows who can consume
  # the package. That is a compatibility decision, never routine maintenance, so
  # none of them are automated.
  - package-ecosystem: nuget
    directory: "/src/DocToolkit.Extensions.DependencyInjection"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      - dependency-name: "Ank.DocToolkit"
      - dependency-name: "Microsoft.Extensions.DependencyInjection.Abstractions"
      - dependency-name: "Microsoft.Extensions.Options"
      # And the rest, for the lockfile reason given in the block above.
      - dependency-name: "*"

  # ── Test projects ───────────────────────────────────────────────────────────
  # No lockfiles here (see the design doc), so dependabot-core#13950 cannot fire.
  # Grouped into one PR and prefixed chore: these do not ship, so they stay out
  # of the public changelog.
  - package-ecosystem: nuget
    directories:
      - "/tests/DocToolkit.Tests"
      - "/tests/DocToolkit.Extensions.DependencyInjection.Tests"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      # Minor and patch only. A major (xunit 2.x -> 3.x, for example) is a
      # migration, not a bump, and arrives as its own PR to be reviewed alone.
      test-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # These repeat the src/ blocks' rules ON PURPOSE. An ignore rule is scoped
      # to the block that declares it, but the test projects reach src/ through
      # ProjectReference - and Dependabot follows those references and edits the
      # src csproj files, which belong to other blocks and are therefore outside
      # those blocks' ignore rules.
      #
      # That is not hypothetical: a grouped run from this block proposed
      # SixLabors.Fonts [1.0.0] -> [3.0.0], straight past the revenue-gated 2.x
      # line the pin exists to prevent, plus three shipped floors ignored
      # elsewhere. CI caught it. This stops it being proposed at all.
      #
      # scripts/check-dependabot-scoping.py now asserts this repetition rather than
      # trusting the comment: it derives the required set from the src/ blocks, so
      # deleting one of these lines - or adding a NEW block that forgets them - fails
      # the build instead of silently reopening the hole.
      # SixLabors.Fonts is NOT repeated here - it is in the derived list below, and
      # Dependabot rejects a duplicate dependency-name outright rather than ignoring it.
      - dependency-name: "Ank.DocToolkit"
      - dependency-name: "Microsoft.Extensions.DependencyInjection.Abstractions"
      - dependency-name: "Microsoft.Extensions.Options"
      # ── EVERY PACKAGE THE SHIPPED LIBRARY DECLARES ──────────────────────────
      # Added 2026-08-24, as C37. Both /src/ blocks ignore "*" and propose nothing, and
      # their comment says bumps there "stay a deliberate manual act" - but this block
      # reaches src/ and Dependabot edits the src csproj on its way past, so it was the
      # ONLY automated path that touched a shipped dependency.
      #
      # #366 proved the cost: titled "Bump the test-dependencies group", it moved OfficeIMO
      # 3.2.2 -> 3.2.6 across eight packages plus AngleSharp and PdfPig, under `chore:` -
      # hidden and non-bumping. A consumer would have restored four patch versions of the
      # engine behind every DOCX, XLSX, PPTX and PDF path with nothing in the changelog. It
      # truncated all eight lockfiles too, exactly as the /src/ blocks predict.
      #
      # check-dependabot-scoping.py DERIVES this list from src/Directory.Build.props, so a
      # sixteenth package joins by being added and deleting a line here fails the build.
      # dependency-report.yml still reports these weekly, read-only.
      - dependency-name: "AngleSharp"
      - dependency-name: "ClosedXML"
      - dependency-name: "DocumentFormat.OpenXml"
      - dependency-name: "HtmlToOpenXml.dll"
      - dependency-name: "OfficeIMO.Excel"
      - dependency-name: "OfficeIMO.Excel.Pdf"
      - dependency-name: "OfficeIMO.PowerPoint"
      - dependency-name: "OfficeIMO.PowerPoint.Pdf"
      - dependency-name: "OfficeIMO.Word"
      - dependency-name: "OfficeIMO.Word.Html"
      - dependency-name: "OfficeIMO.Word.Markdown"
      - dependency-name: "OfficeIMO.Word.Pdf"
      - dependency-name: "PDFsharp"
      - dependency-name: "PdfPig"
      - dependency-name: "SixLabors.Fonts"

  # ── Samples have no block of their own ──────────────────────────────────────
  # They reference the published packages as Version="*", so nothing needs to
  # propose a bump for those - the newest release is what restores.
  #
  # But "deliberately absent" was too strong, and was proved so on 2026-08-09: the
  # root block below is rooted at "/", which puts DocToolkit.sln in view, and a
  # solution reaches every project. It proposed Microsoft.Extensions.Hosting
  # 8.0.1 -> 10.0.10 for samples/WorkerService, whose pin exists precisely to stop
  # someone else's release reddening a sample. So any sample that pins a FIXED
  # version needs an ignore in the root block, and scripts/check-dependabot-scoping.py
  # now asserts that rather than trusting this paragraph.
  # They reference the published packages as Version="*", so they always restore
  # the newest release without anything proposing a bump.
  #
  # An earlier revision had Dependabot chase a version floor here. That worked
  # once and then became a loop: bumping the floor is a merge, every merge is a
  # release, and every release made the floor stale again - a weekly PR that
  # published a version containing nothing but a sample's version number.

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  # Actions are pinned to commit SHAs, each with a trailing `# vX.Y.Z` comment.
  # A tag is a mutable pointer the upstream owner can move, so `@v7` is a promise
  # to run whatever that account publishes later - and publishing here is
  # OIDC-only, with no stored API key left to steal, which makes the workflow
  # itself the realistic attack path. A SHA cannot be moved.
  #
  # This block is what keeps that from freezing the actions at their pinned
  # versions forever: Dependabot reads the trailing comment to learn the current
  # version and rewrites BOTH the SHA and the comment. Keep the comment on every
  # pinned `uses:` - without it Dependabot cannot tell what version the SHA is,
  # and the pin silently stops being updated.
  # ── The local tool manifest ─────────────────────────────────────────────────
  # .config/dotnet-tools.json only. Dependabot supports the manifest ONLY in
  # .config/ and not at the repository root (dependabot-core#7969), which is why
  # it lives there rather than beside the solution.
  #
  # This block is rooted at "/" because that is where Dependabot looks for
  # .config/dotnet-tools.json. That also puts DocToolkit.sln in its view, and a
  # solution reaches every project - so per the trap recorded in the backlog as
  # C19, every guard that protects src/ is REPEATED here. An ignore rule is
  # scoped to the block that declares it; a new block does not inherit anything.
  # Without these, a bump proposed through the solution would bypass the pins
  # that the per-project blocks above exist to enforce.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      # The licensing wall - SixLabors.Fonts - is in the derived list below rather than
      # here, so it is not repeated as its own entry: Dependabot rejects a duplicate
      # dependency-name outright. The derived entry ignores it ENTIRELY where this one
      # ignored only its majors; ignoring more is always safe, and src/ pins it to an
      # exact version anyway.
      # Repeated from /src/DocToolkit.Extensions.DependencyInjection - raising a
      # floor narrows who can consume the package, which is never routine.
      - dependency-name: "Ank.DocToolkit"
      - dependency-name: "Microsoft.Extensions.DependencyInjection.Abstractions"
      - dependency-name: "Microsoft.Extensions.Options"
      # samples/WorkerService pins this to 8.0.x to match its net8.0 target. The
      # sample is reached from here through the solution, and a bump to 10.x would
      # be exactly the unrelated-upstream-release noise the pin exists to prevent.
      - dependency-name: "Microsoft.Extensions.Hosting"
      # ── EVERY PACKAGE THE SHIPPED LIBRARY DECLARES ──────────────────────────
      # Added 2026-08-24, as C37. Both /src/ blocks ignore "*" and propose nothing, and
      # their comment says bumps there "stay a deliberate manual act" - but this block
      # reaches src/ and Dependabot edits the src csproj on its way past, so it was the
      # ONLY automated path that touched a shipped dependency.
      #
      # #366 proved the cost: titled "Bump the test-dependencies group", it moved OfficeIMO
      # 3.2.2 -> 3.2.6 across eight packages plus AngleSharp and PdfPig, under `chore:` -
      # hidden and non-bumping. A consumer would have restored four patch versions of the
      # engine behind every DOCX, XLSX, PPTX and PDF path with nothing in the changelog. It
      # truncated all eight lockfiles too, exactly as the /src/ blocks predict.
      #
      # check-dependabot-scoping.py DERIVES this list from src/Directory.Build.props, so a
      # sixteenth package joins by being added and deleting a line here fails the build.
      # dependency-report.yml still reports these weekly, read-only.
      - dependency-name: "AngleSharp"
      - dependency-name: "ClosedXML"
      - dependency-name: "DocumentFormat.OpenXml"
      - dependency-name: "HtmlToOpenXml.dll"
      - dependency-name: "OfficeIMO.Excel"
      - dependency-name: "OfficeIMO.Excel.Pdf"
      - dependency-name: "OfficeIMO.PowerPoint"
      - dependency-name: "OfficeIMO.PowerPoint.Pdf"
      - dependency-name: "OfficeIMO.Word"
      - dependency-name: "OfficeIMO.Word.Html"
      - dependency-name: "OfficeIMO.Word.Markdown"
      - dependency-name: "OfficeIMO.Word.Pdf"
      - dependency-name: "PDFsharp"
      - dependency-name: "PdfPig"
      - dependency-name: "SixLabors.Fonts"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # Minor and patch only, so majors arrive one PR at a time.
      #
      # The first grouped run bundled EIGHT majors into a single PR, including
      # googleapis/release-please-action v4 -> v5 - the action that now drives
      # unattended publishing. PR CI cannot catch a regression there: it only
      # runs ci.yml, while release-please.yml, release.yml and docs.yml are
      # exercised solely after a merge. A green check on such a PR means less
      # than it looks like, so majors must be reviewable individually.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
