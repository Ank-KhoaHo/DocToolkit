name: CodeQL

# Static analysis behind the security claim this package now makes in public.
#
# SECURITY.md states a boundary - the remote-image guard refuses private addresses,
# speaks only http/https, follows no redirects, caps every fetch - and states where
# that boundary stops. A stated boundary with nothing analysing the code behind it is
# a claim resting entirely on review having been thorough. This is the cheap machine
# check that keeps it honest between reviews.
#
# Scope note: CodeQL analyses THIS repository's own code - the C#, and since D48 the
# Python under scripts/ and the workflow files themselves. It is not a dependency scanner -
# Dependabot alerts cover the resolved graph, and ci.yml's premise guards cover
# licensing and native binaries. Three different questions, three different tools.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds existing code rather than waiting for
    # the next push. Monday 03:17 UTC - an odd minute, because GitHub drops scheduled
    # runs that pile up on the hour.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: DocToolkit.sln

jobs:
  analyze:
    name: analyze (csharp)
    runs-on: ubuntu-latest

    permissions:
      # Least privilege, matching docs.yml and release.yml rather than inheriting the
      # repository default. security-events: write is what lets results reach the
      # Security tab; without it the upload step fails at the very end of the run.
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both SDKs: the projects multi-target net8.0;net10.0, and a manual build below
      # needs to resolve both.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.302
          # Same cache as ci.yml; see the build & test block there.
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          # Manual rather than build-mode: none. Buildless C# analysis skips code it
          # cannot resolve, and this repository's interesting surface - the resource
          # loader, the address classifier, the Stream overloads - is exactly the code
          # a resolver would struggle with across two target frameworks.
          build-mode: manual
          queries: security-and-quality
          # Scopes WHERE the analysis looks, never WHAT it looks for - the query pack above is
          # unchanged. It excludes bin/ and obj/, because CodeQL was raising alerts against
          # generated Razor output that nobody writes and every build regenerates. See the
          # file's own comment for why noise is treated as a defect here rather than tolerated.
          config-file: ./.github/codeql-config.yml

      # Deliberately NOT -warnaserror, unlike ci.yml. This build exists to produce
      # something for CodeQL to analyse; failing it on a warning would hide the
      # analysis rather than surface a problem, and ci.yml already holds that line on
      # the same commit.
      - name: Build
        run: |
          dotnet restore "$SOLUTION"
          dotnet build "$SOLUTION" -c Release --no-restore

      # Analyse, filter, then upload - three steps where one used to do all of it (C47).
      # codeql-config.yml's paths-ignore does nothing for C# built with build-mode: manual
      # (GitHub applies it only to languages analysed without a build), so alerts landed in
      # obj/.../RegexGenerator.g.cs. The build cannot skip obj/: the [GeneratedRegex] output
      # there is part of the library. So the results in bin/ and obj/ are dropped from the
      # SARIF instead, by a script with its own --self-test (run in ci.yml's format job).
      # failure-only is the analyze action's documented mode for post-processing: a failed
      # run still uploads its debugging data.
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:csharp"
          output: sarif-results
          upload: failure-only

      - name: Drop results in generated bin/ and obj/ output
        run: python3 scripts/filter-codeql-sarif.py sarif-results/csharp.sarif

      - name: Upload results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif-results/csharp.sarif
          category: "/language:csharp"

  # The code that is not C#, analysed without a build (D48). `actions` reads the workflow files
  # themselves - release.yml holds the token that publishes to nuget.org, and a workflow that
  # puts untrusted input into a shell command is the classic way to lose one. `python` reads
  # scripts/, which every CI check runs. Neither needs the bin/obj filter above: nothing is
  # built, so paths-ignore in codeql-config.yml applies as written.
  analyze-other:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          config-file: ./.github/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
