name: Mutation testing

# Keeps "the guard is proved by mutation" true as the code changes.
#
# That claim was earned by hand, once, at authoring time - somebody flipped the
# offline switch and watched nine tests go red. It stayed in README.md
# afterwards with nothing re-checking it, which is exactly the shape of every
# other stale claim this repository has had to correct. Stryker re-earns it.
#
# WHY THIS IS NOT A PULL-REQUEST CHECK. Measured 2026-08-08 on the scoped file
# set: 3m52s locally for 409 mutants, and 11 of them timed out - mutation
# testing deliberately runs code that loops forever, so timeouts are normal
# rather than a fault. Adding four-plus minutes and a class of inherently
# timing-sensitive results to every pull request buys little: a mutation score
# moves when TESTS change, and it moves slowly. Weekly, plus on demand, catches
# the drift it exists to catch. `dotnet test` remains the per-PR gate.
#
# SCOPE IS DELIBERATE, AND IT IS STILL NOT THE WHOLE LIBRARY. stryker-config.json
# mutates the files where a silently weak test is most expensive - the resource
# loaders, the page-setup and section-properties factories, the run splicer, the
# table-row finder, the shared stream pipeline, the XLSX exporters and the two
# option factories that hold the offline guarantees. Those are the places
# CLAUDE.md's traps live.
#
# It was nine files until B14 (2026-08-14) and is now fifteen. Widening was worth
# doing and was NOT free, which is the part to remember: the six new files brought
# 25 survivors with them, and the score fell 97.60% -> 92.87%, under the break
# threshold. Adding the files and lowering the gate would have been the wrong
# trade; the tests came first, then the scope.
#
# RUNTIME, measured on this runner rather than inferred from a laptop: 15m52s for
# the widened scope. MEASURED ON CI 2026-08-24 at 43m36s for 635 mutants, which is why
# timeout-minutes is now 90. Locally the same run is ~20m, so
# CI costs about 3.4x - which is the ratio to use when pricing any further widening,
# NOT the local number.
#
# THE SCORE IS HIGHER ON CI THAN LOCALLY, and the reason is worth knowing before
# reading a future drop as a regression: 96.72% here against 96.55% locally, because
# a slower runner produces more TIMEOUTS (15 vs 10) and a timeout counts as killed.
# So CI is the friendlier environment for this number, and the local measurement is
# the closer thing to a worst case. A score that falls BELOW the local figure is the
# signal, not one that sits between them.
#
# Mutating the WHOLE library is still not proposed: 576 of 2827 created mutants are
# tested today, so it is roughly a 5x step - which at 3.4x CI cost would approach the
# job timeout - and it trades a focused signal for a much longer run.

# THE SURVIVORS THAT REMAIN ARE THE FLOOR, not a backlog. Measured 2026-08-14 at
# 96.55% on the widened scope: 16 survive, and each was traced by hand rather than
# left unexplained.
#
#   5 equivalent mutants, unkillable by any test. Four in RunTextSplicer and one in
#     GuardedResourceLoader; the reasoning for each sits beside the code it concerns,
#     in RunTextSplicerTests and Ipv6TransitionNearMissTests.
#   6 exception-message strings - four in ImageInspector, two in XlsxFormat. Killing
#     them means asserting exact wording, which is brittle for what it buys: the
#     messages already have their DIAGNOSTIC content asserted where two guards would
#     otherwise be indistinguishable.
#   3 scratch.Dispose() removals in StreamPipeline. A MemoryStream holds no unmanaged
#     resource and has no finalizer, and on all three paths the buffer is thrown away
#     rather than handed back - so no caller can observe the difference. Same fact
#     that makes CodeQL's cs/dispose-not-called-on-throw a false positive there.
#   1 AllowedImageDirectories.Clear() removal in MarkdownImportOptions. MEASURED to be
#     masked by AllowLocalImages = false: with the flag set, a relative-path image is
#     blocked whether the list was cleared or not. Defence in depth, so neither layer
#     is individually observable through the public API.
#   1 block removal on PdfRenderPolicy's test-only accessor. Benign.
#
# NewScratch carries a `// Stryker disable all` with its reasoning, for the same
# class of reason as ignore-methods: ["ConfigureAwait"] - every branch of it returns
# a correct buffer and only the initial capacity differs, so its 9 mutants were
# equivalent by construction.
#
# So a future pass chasing the score should expect to find nothing cheap. If the score
# DROPS, that is a real regression; if it sits here, the suite is doing its job.

on:
  schedule:
    # Mondays, 04:17 UTC. Off the hour on purpose: scheduled workflows queue
    # heavily on the hour across GitHub.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation score
    runs-on: ubuntu-24.04
    # 90, raised from 45 on 2026-08-24 with the number measured rather than guessed.
    #
    # The restored scope cost 43m36s on CI - 635 mutants, which is 84 SECONDS under the old limit.
    # It had been passing in minutes only because `project: DocToolkit.csproj` plus a net8.0
    # analysis failure had collapsed the run to 27 mutants in one project; see B27.
    #
    # A timeout here is the worst available outcome: it produces no score at all, so nothing
    # distinguishes "the suite is slow today" from "the gate would have failed". Headroom is
    # cheaper than that ambiguity on a weekly job.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.302
          # Same cache as ci.yml; see the build & test block there.
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore local tools
        run: dotnet tool restore

      # Fails the job when the score falls under the `break` threshold in
      # stryker-config.json, which is the ONLY place that number is authoritative.
      # Don't copy it into a comment - this one used to say "Measured 74.30% on
      # 2026-08-08; break sits at 70" while the block at the top of this same file
      # said 97.52% and the config said 95, and CLAUDE.md said 88 in one sentence
      # and 85 in the next. Four written-down values, one real one. The gate still
      # sits under the measured score for the reason it always did - the same
      # reasoning as scripts/check-coverage.py's floors: a threshold set exactly at
      # the measurement fails on the day it lands and trains people to lower it.
      - name: Run Stryker
        run: dotnet stryker

      # THE SCORE IS MEANINGLESS WITHOUT ITS DENOMINATOR, and nothing reported the denominator
      # until 2026-08-24. `project: DocToolkit.csproj` scoped the run to one project, the
      # per-concern split moved 11 of the 15 scoped files into siblings, and a 16th pattern had
      # never matched any file - Stryker ignores an unmatched mutate pattern in silence. The suite
      # tested 74 mutants instead of 575 and the score ROSE to 98.65%, clearing break: 95. Three
      # weekly runs passed like that.
      #
      # `if: always()` because a failing score must not hide a collapsed scope: those are different
      # diagnoses and the second one makes the first meaningless.
      - name: Guard - every file the config says to mutate was actually mutated
        if: always()
        run: |
          python3 scripts/check-mutation-scope.py --self-test
          python3 scripts/check-mutation-scope.py

      # Uploaded even on failure: when the score drops, the HTML report naming
      # the surviving mutants IS the diagnosis, and re-running locally to get it
      # costs another four minutes.
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: StrykerOutput/*/reports/
          if-no-files-found: warn
