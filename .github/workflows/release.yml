name: Release

# Publishes BOTH packages - Ank.DocToolkit and Ank.DocToolkit.Extensions.DependencyInjection -
# from a single tag, at the same version, in the same run. That is deliberate: the two packages
# are meant to stay in lockstep, and nuget.org Trusted Publishing policies are keyed to an exact
# workflow FILENAME, so a single workflow file also means a single policy to configure, ever.
# (An earlier version of this pipeline split the two into release.yml/release-extensions.yml with
# independent v*/ext-v* tags - that required a second policy per workflow file and let the two
# packages' versions drift apart with no way to enforce they matched. Don't reintroduce that split.)
#
# Publishing to nuget.org is IRREVERSIBLE - a version can be unlisted but never deleted or
# replaced. So this workflow re-proves everything before it pushes: the full test suite AND the
# licence/native-binary guards that are the reason this package exists. A release that breaks the
# premise is worse than no release. --skip-duplicate makes a re-run (or a version already pushed
# for one package but not the other) safe: it never fails just because a version already exists.
#
# Trigger by pushing a tag:   git tag v1.0.0 && git push origin v1.0.0
# The tag is the single source of truth for the version - the <Version> in each csproj is only a
# local dev default, and does not need to (and won't) match.
#
# AUTHENTICATION: Trusted Publishing (OIDC) - no API key is stored anywhere.
# GitHub mints a short-lived, signed token describing this repo+workflow;
# nuget.org validates it against a policy you configured and hands back an API
# key valid for 1 hour. Nothing long-lived exists to leak, expire or rotate.
#
# Requires on nuget.org (your name > Trusted Publishing):
#   Repository Owner : Ank-KhoaHo
#   Repository       : DocToolkit
#   Workflow File    : release.yml      <- filename only, no path
# and either a repository variable or secret NUGET_USER holding your nuget.org
# PROFILE NAME (not your email address).

on:
  push:
    tags: ["v*"]
  # Belt-and-braces: release-please (release-please.yml) creates its tag as a side effect
  # of creating a GitHub Release via the API, not a plain `git push --tags`. Whether that
  # reliably fires `push.tags` is genuinely undocumented by GitHub and reported inconsistently
  # in the wild - verified while investigating, not assumed. `release: published` is GitHub's
  # own documented, explicit mechanism for "a release was published" and sets GITHUB_REF_NAME
  # to the tag name the same way a tag push does, so no other step below needs to change.
  # Both triggers firing for the same tag is safe, not a bug: every step below (including the
  # GitHub Release step and the nuget push) is idempotent to a re-run.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish for BOTH packages (e.g. 1.0.0). Dry-run unless 'publish' is ticked."
        required: true
      publish:
        description: "Actually push to nuget.org"
        type: boolean
        default: false

# Serialises releases. Deliberately the OPPOSITE of ci.yml's settings on both counts, because this
# workflow publishes to nuget.org and a published version can be unlisted but never deleted or
# reused.
#
#   group is a CONSTANT, not ${{ github.ref }}. Each tag is its own ref, so a per-ref group would
#   put two tags pushed a minute apart in different groups and let them run at once - exactly the
#   race this exists to stop. It also covers the two triggers above racing each other for the same
#   tag, since both map to this one group.
#
#   cancel-in-progress is FALSE. Cancelling a release mid-run is the worst available outcome: the
#   push step does the two packages in sequence, so a cancellation between them leaves one
#   published and the other not, at a version that can never be reused. Queue behind it instead.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # needed to create the GitHub Release
  id-token: write # REQUIRED for Trusted Publishing - without it the OIDC token
  # request fails silently and NuGet/login returns no key
  attestations: write # lets the build sign a provenance statement for each .nupkg

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/DocToolkit/DocToolkit.csproj
  EXTENSIONS_PROJECT: src/DocToolkit.Extensions.DependencyInjection/DocToolkit.Extensions.DependencyInjection.csproj
  SOLUTION: DocToolkit.sln

jobs:
  release:
    name: verify, pack and publish
    # Pinned for the same reason as ci.yml, and it matters more here. This job
    # runs the suite and all four premise guards and then pushes to nuget.org,
    # which cannot be undone - a version can be unlisted, never replaced. Letting
    # the `latest` alias move the toolchain underneath an irreversible publish is
    # the one place a surprise is least affordable, and it would also mean the
    # runner that verifies a release differs from the one ci.yml verified the
    # same commit on.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so release notes can be generated

      # NuGet caching is deliberately NOT enabled here, unlike ci.yml, codeql.yml,
      # docs.yml and mutation.yml. This job's cold restore is a second, independent proof
      # that the dependency graph resolves from nothing - ci.yml's linux-container job
      # already proves that on every push and PR, from a bare SDK image - but this is the
      # run that cannot be undone. A nuget.org version can be unlisted, never deleted or
      # reused.
      #
      # Keeping it cold also costs nothing measurable. Caching made the whole CI run
      # SLOWER when measured on 2026-08-08 (175s -> 187s), because downloading the 222 MB
      # cache outweighs the restore it saves. Do not "finish the job" by adding it here.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.302

      # ---- version comes from the tag, so there is one source of truth ----
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            PUBLISH="${{ inputs.publish }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"     # v1.2.3 -> 1.2.3
            PUBLISH="true"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid SemVer version. Tag as v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT";;
                             *)   echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
          echo "Releasing version $VERSION for both packages (publish=$PUBLISH)"

      - name: Guard - CHANGELOG.md has a non-empty entry for this version
        run: |
          VERSION="${{ steps.v.outputs.version }}"

          if ! grep -Eq "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::Refusing to publish - CHANGELOG.md has no '## [$VERSION]' entry. Add one before tagging."
            exit 1
          fi

          # The heading existing is not the same as the entry saying anything. release-please
          # proposes a version for any bump-computing commit, and the types that are hidden from
          # the changelog still bump - so a Release PR can carry a heading with nothing under it,
          # and merging it publishes a version that tells consumers nothing. A nuget.org version
          # can be unlisted but never deleted or reused, so that is not recoverable.
          #
          # Matched by index, not regex, because the version is bracketed and would otherwise need
          # escaping. Stops at the next '## ' heading; '### Added' does not match that, so section
          # headings inside the entry are correctly treated as part of it.
          BODY=$(awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { inside = 1; next }
            inside && /^## /    { exit }
            inside              { print }
          ' CHANGELOG.md)

          # A real entry has at least one list item. A heading with only blank lines and '###'
          # section headings under it is the empty release this guard exists to stop.
          if ! printf '%s\n' "$BODY" | grep -Eq '^[[:space:]]*[*-] '; then
            echo "::error::Refusing to publish - CHANGELOG.md's '## [$VERSION]' entry has no content. An empty entry means a version that tells consumers nothing, and a published version cannot be deleted or reused. Let more changes accumulate, or write the entry."
            exit 1
          fi

          echo "CHANGELOG.md has an entry for $VERSION with $(printf '%s\n' "$BODY" | grep -Ec '^[[:space:]]*[*-] ') item(s)"

      - name: Fail early if the nuget.org username is missing
        if: steps.v.outputs.publish == 'true'
        run: |
          USER="${{ secrets.NUGET_USER || vars.NUGET_USER }}"
          if [ -z "$USER" ]; then
            echo "::error::NUGET_USER is not set. Add your nuget.org PROFILE NAME (not your email) as a repository variable or secret under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "nuget.org user configured"

      # ---- never publish a graph nobody reviewed ----
      # The guards below check WHAT the resolved graph contains. This one checks
      # it is the graph we agreed to: --locked-mode fails rather than silently
      # re-resolving. Placed before Build because Build's implicit restore would
      # otherwise re-resolve first, so the publish would be built from a graph
      # that was never compared against the committed lockfiles.
      #
      # tests/ and samples/ deliberately carry no lockfile, so the two packable
      # projects are restored individually rather than the solution.
      - name: Guard - the resolved graph matches the committed lockfiles
        run: |
          for project in "${{ env.PROJECT }}" "${{ env.EXTENSIONS_PROJECT }}"; do
            echo "::group::$project"
            if ! dotnet restore "$project" --locked-mode; then
              echo "::error::Refusing to publish - $project restored differently from its committed packages.lock.json. Run 'dotnet restore $project --force-evaluate' and commit the updated lockfile."
              exit 1
            fi
            echo "::endgroup::"
          done

      # ---- never publish something that is not green ----
      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release -warnaserror

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} -c Release --no-build

      # ---- never publish something that broke the design premise ----
      - name: Guard - no native binaries
        run: |
          mapfile -t native < <(find . -path '*/bin/*' \
            \( -name '*.so' -o -name '*.so.*' -o -name '*.dylib' \) -print)
          echo "native binaries found: ${#native[@]}"
          if [ "${#native[@]}" -ne 0 ]; then
            printf '  %s\n' "${native[@]}"
            echo "::error::Refusing to publish - native binaries in build output."
            exit 1
          fi

      - name: Guard - no banned packages
        run: |
          banned='EPPlus|NPOI|Spire\.|Syncfusion|QuestPDF|IronPDF|ShapeCrawler|SkiaSharp|Magick\.NET|System\.Drawing\.Common'
          for project in "${{ env.PROJECT }}" "${{ env.EXTENSIONS_PROJECT }}"; do
            echo "::group::$project"
            dotnet list "$project" package --include-transitive > graph.txt
            if grep -Eiq "$banned" graph.txt; then
              grep -Ei "$banned" graph.txt
              echo "::error::Refusing to publish - a package that is not free for commercial use, or carries native payload, is in the graph of $project."
              exit 1
            fi
            echo "no banned packages"
            echo "::endgroup::"
          done

      - name: Guard - SixLabors.Fonts still on the permissive 1.x line
        run: |
          for project in "${{ env.PROJECT }}" "${{ env.EXTENSIONS_PROJECT }}"; do
            echo "::group::$project"
            resolved=$(dotnet list "$project" package --include-transitive \
              | grep -i 'SixLabors.Fonts' | awk '{print $NF}' | sort -u | head -1)
            echo "SixLabors.Fonts resolved: ${resolved:-<not found>}"
            case "$resolved" in
              1.*) echo "ok - Apache-2.0" ;;
              *)   echo "::error::Refusing to publish - SixLabors.Fonts is ${resolved:-missing} in $project; 2.x is revenue-gated."; exit 1 ;;
            esac
            echo "::endgroup::"
          done

      # Release notes come from the CURATED CHANGELOG.md entry, not from commit titles.
      #
      # Every version page on nuget.org showed an EMPTY Release Notes section, on a package that
      # curates an entry per release. This is the same extractor release-please.yml already uses
      # for the GitHub Release body, so one curated entry now reaches three surfaces from a single
      # source - the same move gen-third-party-notices.py makes by reading the lockfile.
      #
      # A FILE, not an inline value: an MSBuild property splits on semicolons, so an entry
      # containing one would be silently truncated on the command line. src/Directory.Build.props
      # reads the file; see the target there for why it hooks GenerateNuspec.
      #
      # It runs AFTER "Guard - CHANGELOG.md has a non-empty entry for this version", so an empty
      # entry cannot reach a package - that guard has already failed the job by this point. The
      # test below is a second, cheaper net for the case where the guard's shape and the
      # extractor's disagree.
      - name: Extract the curated changelog entry for the release notes
        run: |
          set -euo pipefail
          python3 scripts/extract-changelog-section.py "${{ steps.v.outputs.version }}" \
            > "${{ runner.temp }}/release-notes.md"
          echo "--- release notes going into both packages ---"
          cat "${{ runner.temp }}/release-notes.md"
          test -s "${{ runner.temp }}/release-notes.md" \
            || { echo "::error::The extracted changelog entry is empty. Refusing to pack notes nobody wrote."; exit 1; }

      # NO `no-build` SWITCH HERE, AND THAT IS THE WHOLE POINT.
      #
      # It was there until 0.36.0, and it is why that version shipped broken. The core package
      # assembles SEVEN assemblies into one nupkg through a TargetsForTfmSpecificBuildOutput target
      # that reads @(ReferenceCopyLocalPaths) - and only ResolveReferences populates that item.
      # `no-build` skips ResolveReferences, so the list came out empty, BuildOutputInPackage added
      # nothing, and 0.36.0 went to nuget.org carrying DocToolkit.dll ALONE: a 67 KB shell against
      # 266 KB of working library in pre-split 0.35.0. Consumers got CS0012 on PageSetup and
      # CS0103 on DocxEditor and could not compile at all.
      #
      # Nothing caught it because nothing else packs this way. A plain `dotnet pack` runs
      # ResolveReferences and emits all seven, so every local pack and every CI pack was correct -
      # only the release was wrong, and only on the one run that cannot be undone.
      #
      # Sources are unchanged since the build step above and the build is deterministic, so this
      # re-runs incrementally and still ships what the suite ran against. Both packs are kept
      # identical so the switch cannot creep back onto just one of them.
      - name: Pack
        run: |
          dotnet pack ${{ env.PROJECT }} -c Release \
            -p:Version=${{ steps.v.outputs.version }} \
            -p:PackageVersion=${{ steps.v.outputs.version }} \
            -p:PackageReleaseNotesFile=${{ runner.temp }}/release-notes.md
          dotnet pack ${{ env.EXTENSIONS_PROJECT }} -c Release \
            -p:Version=${{ steps.v.outputs.version }} \
            -p:PackageVersion=${{ steps.v.outputs.version }} \
            -p:PackageReleaseNotesFile=${{ runner.temp }}/release-notes.md
          ls -la artifacts/

      # Checks the ASSEMBLIES inside each nupkg. The step below it checks the nuspec's
      # DEPENDENCIES, which is a different question - and the reason 0.36.0 shipped a package with
      # correct dependencies and six of its seven assemblies missing. Nothing looked at lib/.
      - name: Guard - every assembly each package ships is actually in it
        run: |
          python3 scripts/check-package-contents.py --self-test
          python3 scripts/check-package-contents.py artifacts/*.nupkg

      # THE ONLY CHECK THAT RUNS A CONSUMER BEFORE THE PUBLISH. Issue #383, filed after 0.36.0.
      #
      # The suite builds against project references; the guard above reads the nupkg's assembly
      # list but executes nothing; and `install-smoke.yml` compiles a real consumer app only AFTER
      # Release finishes - by which point a defect it finds is permanent, because a nuget.org
      # version can be unlisted but never replaced.
      #
      # Verified against a REPRODUCTION of the 0.36.0 defect rather than a synthetic one: packing
      # with the `no-build` switch again yields the same one-assembly package, and this fails with
      # the same CS0103/CS0012 a consumer saw.
      - name: Guard - a clean consumer can install and run the packed packages
        run: |
          python3 scripts/check-packed-install.py --self-test
          python3 scripts/check-packed-install.py --artifacts artifacts

      - name: Verify package contents
        run: |
          python3 - "${{ steps.v.outputs.version }}" <<'PY'
          import glob, sys, zipfile
          version = sys.argv[1]

          packages = {
              'Ank.DocToolkit': [
                  'DocumentFormat.OpenXml', 'HtmlToOpenXml.dll', 'OfficeIMO.Word.Pdf', 'ClosedXML',
              ],
              'Ank.DocToolkit.Extensions.DependencyInjection': [
                  'Ank.DocToolkit', 'Microsoft.Extensions.DependencyInjection.Abstractions',
                  'Microsoft.Extensions.Options',
              ],
          }

          failures = []
          for pkg_id, deps in packages.items():
              hits = sorted(glob.glob(f'artifacts/{pkg_id}.{version}.nupkg'))
              if len(hits) != 1:
                  failures.append(f'{pkg_id}: expected exactly one nupkg for version {version}, found {hits}')
                  continue
              pkg = hits[0]
              z = zipfile.ZipFile(pkg)
              names = z.namelist()
              nuspec = z.read([n for n in names if n.endswith('.nuspec')][0]).decode('utf-8')

              for required in ['lib/net8.0/', 'lib/net10.0/', 'README.md', 'THIRD-PARTY-NOTICES.txt']:
                  ok = any(n.startswith(required) or n == required for n in names)
                  print(f'{pkg_id}: ' + ('OK   ' if ok else 'MISS ') + required)
                  if not ok: failures.append(f'{pkg_id}: missing {required}')

              for dep in deps:
                  ok = dep in nuspec
                  print(f'{pkg_id}: ' + ('OK   dep ' if ok else 'MISS dep ') + dep)
                  if not ok: failures.append(f'{pkg_id}: missing dep {dep}')

              if '<license type="expression">MIT' not in nuspec:
                  failures.append(f'{pkg_id}: missing MIT licence expression')
              if any(n.startswith('runtimes/') for n in names):
                  failures.append(f'{pkg_id}: runtimes/ - native payload in package')
              if f'<version>{version}</version>' not in nuspec:
                  failures.append(f'{pkg_id}: nuspec version is not {version}')

          if failures:
              sys.exit('package verification failed: ' + '; '.join(failures))
          print(f'\nboth packages verified at version {version}')
          PY

      # ---- the irreversible bit ----
      # The temporary key is valid for ONE hour, so it is requested here - after
      # every check has passed - rather than at the top of the job. One OIDC
      # exchange covers both packages: the key is scoped to the account, not to
      # a single package ID.
      #
      # This runs on dry runs TOO, deliberately: it is the only way to prove the
      # Trusted Publishing policy actually works without publishing. A dry run
      # that skipped it would pass while the policy was misconfigured, and the
      # failure would surface on the one run that cannot be undone.
      # The machine-readable counterpart to THIRD-PARTY-NOTICES.txt. That file is for a
      # human meeting a licence question; this is for a scanner answering "am I exposed to
      # CVE-X" without resolving the graph itself.
      #
      # CycloneDX is Apache-2.0 and a dotnet tool, so it sits in the existing local manifest
      # and adds nothing to the shipped graph - the SBOM describes the package's
      # dependencies without becoming one of them.
      #
      # --no-serial-number on purpose, and it is worth being precise about what that buys.
      # A CycloneDX serial number is a random UUID per run: a value nobody can explain or
      # reproduce. Dropping it leaves exactly ONE field that varies between two runs over
      # an identical graph - metadata.timestamp - which is both explicable and normalisable.
      #
      # Measured, after the first version of this comment claimed the BOM was byte-stable
      # and it was not: two consecutive runs differed on line 6 and nowhere else. So the
      # honest claim is that the CONTENT is reproducible, not the file. To check a published
      # SBOM, regenerate and compare with the timestamp removed:
      #
      #   diff <(jq 'del(.metadata.timestamp)' published.cdx.json) \
      #        <(jq 'del(.metadata.timestamp)' regenerated.cdx.json)
      #
      # That matters here because the repository already sets Deterministic and
      # ContinuousIntegrationBuild so a published build can be re-derived; an SBOM nobody
      # can re-derive would be the one supply-chain artefact you had to take on trust.
      #
      # THE TIMESTAMP STAYS, and this is the decision rather than an omission. Checked
      # 2026-08-15 against dotnet-CycloneDX 6.2.0: it exposes 34 switches, one of which drops
      # the serial number, and NOT ONE touches metadata.timestamp. So the only way to remove
      # it is to post-process the JSON before attesting - and that is not worth doing.
      #
      # The timestamp is real provenance, and it is already redundant: these SBOMs are covered
      # by actions/attest-build-provenance below, which records when and by which workflow run
      # they were produced in a form a consumer can verify CRYPTOGRAPHICALLY rather than by
      # trusting a field inside the document it is checking. Stripping it would trade
      # information for a tidier diff, against a recipe that is already three lines above.
      #
      # Revisit if a consumer asks for byte-identical SBOMs. Not for tidiness.
      #
      # --exclude-dev keeps development-only dependencies out of a document describing what
      # a consumer actually receives.
      # CycloneDX is a LOCAL tool, so the manifest has to be restored before the command
      # exists. ci.yml, docs.yml and mutation.yml all carry this step; release.yml did not,
      # because until the SBOM step it used no local tool.
      #
      # Its absence failed both v0.17.0 release runs with "Run 'dotnet tool restore' to make
      # the 'dotnet-CycloneDX' command available", and 0.17.0 never reached nuget.org. It was
      # not caught before merging because the command was dry-run on a machine where the tool
      # was already installed - which is exactly the environment CI is not.
      #
      # Placed here rather than beside setup-dotnet so the step that needs it owns it. Failing
      # at this point is safe: nothing has been pushed yet, and every step after it is
      # idempotent to a re-run.
      - name: Restore local tools
        run: dotnet tool restore

      - name: Generate an SBOM for each package
        run: |
          for project in "$PROJECT" "$EXTENSIONS_PROJECT"; do
            name=$(basename "$project" .csproj)
            echo "::group::$name"
            dotnet dotnet-CycloneDX "$project" \
              --output artifacts \
              --filename "$name.cdx.json" \
              --json \
              --no-serial-number \
              --exclude-dev
            echo "::endgroup::"
          done

          # An empty or component-less BOM would upload happily and tell a scanner nothing,
          # so it is treated as a failed release rather than a quiet one.
          for bom in artifacts/*.cdx.json; do
            components=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))['components']))" "$bom")
            echo "$bom: $components component(s)"
            if [ "$components" -eq 0 ]; then
              echo "::error::$bom lists no components. Publishing it would answer a scanner's question with silence."
              exit 1
            fi
          done

      - name: NuGet login (OIDC exchange for a short-lived key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER || vars.NUGET_USER }}

      - name: Confirm the OIDC exchange produced a key
        run: |
          if [ -z "${{ steps.login.outputs.NUGET_API_KEY }}" ]; then
            echo "::error::OIDC exchange returned no key. Check: (a) permissions.id-token is 'write', (b) the nuget.org Trusted Publishing policy names owner '${{ github.repository_owner }}', repo '${{ github.event.repository.name }}' and workflow file 'release.yml', (c) NUGET_USER is your nuget.org profile name, not an email."
            exit 1
          fi
          echo "Trusted Publishing OK - short-lived key obtained (valid 1 hour)"

      # Signs a provenance statement for each .nupkg: which workflow, which commit, which runner
      # built it. Anyone can then verify a downloaded package came from this repository and this
      # source, with `gh attestation verify <file> --repo ${{ github.repository }}`.
      #
      # Placed immediately BEFORE the push so the attested bytes are the published bytes. Attesting
      # after would leave a window where what was verified and what shipped are not provably the
      # same artifact.
      #
      # Gated on a real publish, unlike the OIDC exchange above which deliberately runs on dry runs
      # too. The reasoning differs because the artefacts differ: an OIDC exchange proves a policy
      # works and leaves nothing behind, whereas an attestation is a permanent, publicly visible
      # claim. Attesting on a dry run would assert provenance for a package that was never
      # released.
      - name: Attest build provenance for both packages
        if: steps.v.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The SBOMs are attested too. Without it an SBOM is just a file attached to a
          # release, which anyone with write access could replace; attested, it carries
          # proof it came from this workflow and this commit - the same guarantee the
          # packages get, and the reason to trust what it says about them.
          subject-path: |
            artifacts/*.nupkg
            artifacts/*.cdx.json

      - name: Push to nuget.org
        if: steps.v.outputs.publish == 'true'
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
          echo "published ${{ steps.v.outputs.version }} for both packages"

      # release-please (release-please.yml) already creates a GitHub Release with its own
      # generated notes when it pushes the tag, so this step attaches the built packages to
      # that existing release instead of failing on a duplicate. The --generate-notes path
      # below is the fallback for a manually-pushed tag, where no release exists yet.
      - name: Create or update GitHub Release
        if: steps.v.outputs.publish == 'true' && (github.event_name == 'push' || github.event_name == 'release')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists (created by release-please) - attaching packages"
            gh release upload "${GITHUB_REF_NAME}" artifacts/*.nupkg artifacts/*.snupkg artifacts/*.cdx.json --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              ${{ steps.v.outputs.prerelease == 'true' && '--prerelease' || '' }} \
              artifacts/*.nupkg artifacts/*.snupkg artifacts/*.cdx.json
          fi

      - name: Upload packages as build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-${{ steps.v.outputs.version }}
          path: artifacts/*
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Release ${{ steps.v.outputs.version }}"
            echo ""
            if [ "${{ steps.v.outputs.publish }}" = "true" ]; then
              echo "Published Ank.DocToolkit and Ank.DocToolkit.Extensions.DependencyInjection to nuget.org at the same version. Availability in search can lag by a few minutes."
            else
              echo "**Dry run** - packed and verified both packages, Trusted Publishing proven, nothing pushed."
            fi
            echo ""
            echo "- prerelease: ${{ steps.v.outputs.prerelease }}"
            echo "- guards: native binaries, banned packages, SixLabors.Fonts pin - all passed for both projects"
          } >> "$GITHUB_STEP_SUMMARY"
