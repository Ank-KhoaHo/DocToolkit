name: Release

# Publishes BOTH packages - Ank.DocToolkit and Ank.DocToolkit.Extensions.DependencyInjection -
# from a single tag, at the same version, in the same run. That is deliberate: the two packages
# are meant to stay in lockstep, and nuget.org Trusted Publishing policies are keyed to an exact
# workflow FILENAME, so a single workflow file also means a single policy to configure, ever.
# (An earlier version of this pipeline split the two into release.yml/release-extensions.yml with
# independent v*/ext-v* tags - that required a second policy per workflow file and let the two
# packages' versions drift apart with no way to enforce they matched. Don't reintroduce that split.)
#
# Publishing to nuget.org is IRREVERSIBLE - a version can be unlisted but never deleted or
# replaced. So this workflow re-proves everything before it pushes: the full test suite AND the
# licence/native-binary guards that are the reason this package exists. A release that breaks the
# premise is worse than no release. --skip-duplicate makes a re-run (or a version already pushed
# for one package but not the other) safe: it never fails just because a version already exists.
#
# Trigger by pushing a tag:   git tag v1.0.0 && git push origin v1.0.0
# The tag is the single source of truth for the version - the <Version> in each csproj is only a
# local dev default, and does not need to (and won't) match.
#
# AUTHENTICATION: Trusted Publishing (OIDC) - no API key is stored anywhere.
# GitHub mints a short-lived, signed token describing this repo+workflow;
# nuget.org validates it against a policy you configured and hands back an API
# key valid for 1 hour. Nothing long-lived exists to leak, expire or rotate.
#
# Requires on nuget.org (your name > Trusted Publishing):
#   Repository Owner : Ank-KhoaHo
#   Repository       : DocToolkit
#   Workflow File    : release.yml      <- filename only, no path
# and either a repository variable or secret NUGET_USER holding your nuget.org
# PROFILE NAME (not your email address).

on:
  push:
    tags: ["v*"]
  # Belt-and-braces: release-please (release-please.yml) creates its tag as a side effect
  # of creating a GitHub Release via the API, not a plain `git push --tags`. Whether that
  # reliably fires `push.tags` is genuinely undocumented by GitHub and reported inconsistently
  # in the wild - verified while investigating, not assumed. `release: published` is GitHub's
  # own documented, explicit mechanism for "a release was published" and sets GITHUB_REF_NAME
  # to the tag name the same way a tag push does, so no other step below needs to change.
  # Both triggers firing for the same tag is safe, not a bug: every step below (including the
  # GitHub Release step and the nuget push) is idempotent to a re-run.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish for BOTH packages (e.g. 1.0.0). Dry-run unless 'publish' is ticked."
        required: true
      publish:
        description: "Actually push to nuget.org"
        type: boolean
        default: false

permissions:
  contents: write # needed to create the GitHub Release
  id-token: write # REQUIRED for Trusted Publishing - without it the OIDC token
  # request fails silently and NuGet/login returns no key

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/DocToolkit/DocToolkit.csproj
  EXTENSIONS_PROJECT: src/DocToolkit.Extensions.DependencyInjection/DocToolkit.Extensions.DependencyInjection.csproj
  SOLUTION: DocToolkit.sln

jobs:
  release:
    name: verify, pack and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so release notes can be generated

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # ---- version comes from the tag, so there is one source of truth ----
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            PUBLISH="${{ inputs.publish }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"     # v1.2.3 -> 1.2.3
            PUBLISH="true"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid SemVer version. Tag as v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT";;
                             *)   echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
          echo "Releasing version $VERSION for both packages (publish=$PUBLISH)"

      - name: Guard - CHANGELOG.md has an entry for this version
        run: |
          if ! grep -Eq "^## \[${{ steps.v.outputs.version }}\]" CHANGELOG.md; then
            echo "::error::Refusing to publish - CHANGELOG.md has no '## [${{ steps.v.outputs.version }}]' entry. Add one before tagging."
            exit 1
          fi
          echo "CHANGELOG.md has an entry for ${{ steps.v.outputs.version }}"

      - name: Fail early if the nuget.org username is missing
        if: steps.v.outputs.publish == 'true'
        run: |
          USER="${{ secrets.NUGET_USER || vars.NUGET_USER }}"
          if [ -z "$USER" ]; then
            echo "::error::NUGET_USER is not set. Add your nuget.org PROFILE NAME (not your email) as a repository variable or secret under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "nuget.org user configured"

      # ---- never publish a graph nobody reviewed ----
      # The guards below check WHAT the resolved graph contains. This one checks
      # it is the graph we agreed to: --locked-mode fails rather than silently
      # re-resolving. Placed before Build because Build's implicit restore would
      # otherwise re-resolve first, so the publish would be built from a graph
      # that was never compared against the committed lockfiles.
      #
      # tests/ and samples/ deliberately carry no lockfile, so the two packable
      # projects are restored individually rather than the solution.
      - name: Guard - the resolved graph matches the committed lockfiles
        run: |
          for project in "${{ env.PROJECT }}" "${{ env.EXTENSIONS_PROJECT }}"; do
            echo "::group::$project"
            if ! dotnet restore "$project" --locked-mode; then
              echo "::error::Refusing to publish - $project restored differently from its committed packages.lock.json. Run 'dotnet restore $project --force-evaluate' and commit the updated lockfile."
              exit 1
            fi
            echo "::endgroup::"
          done

      # ---- never publish something that is not green ----
      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release -warnaserror

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} -c Release --no-build

      # ---- never publish something that broke the design premise ----
      - name: Guard - no native binaries
        run: |
          mapfile -t native < <(find . -path '*/bin/*' \
            \( -name '*.so' -o -name '*.so.*' -o -name '*.dylib' \) -print)
          echo "native binaries found: ${#native[@]}"
          if [ "${#native[@]}" -ne 0 ]; then
            printf '  %s\n' "${native[@]}"
            echo "::error::Refusing to publish - native binaries in build output."
            exit 1
          fi

      - name: Guard - no banned packages
        run: |
          banned='EPPlus|NPOI|Spire\.|Syncfusion|QuestPDF|IronPDF|ShapeCrawler|SkiaSharp|Magick\.NET|System\.Drawing\.Common'
          for project in "${{ env.PROJECT }}" "${{ env.EXTENSIONS_PROJECT }}"; do
            echo "::group::$project"
            dotnet list "$project" package --include-transitive > graph.txt
            if grep -Eiq "$banned" graph.txt; then
              grep -Ei "$banned" graph.txt
              echo "::error::Refusing to publish - a package that is not free for commercial use, or carries native payload, is in the graph of $project."
              exit 1
            fi
            echo "no banned packages"
            echo "::endgroup::"
          done

      - name: Guard - SixLabors.Fonts still on the permissive 1.x line
        run: |
          for project in "${{ env.PROJECT }}" "${{ env.EXTENSIONS_PROJECT }}"; do
            echo "::group::$project"
            resolved=$(dotnet list "$project" package --include-transitive \
              | grep -i 'SixLabors.Fonts' | awk '{print $NF}' | sort -u | head -1)
            echo "SixLabors.Fonts resolved: ${resolved:-<not found>}"
            case "$resolved" in
              1.*) echo "ok - Apache-2.0" ;;
              *)   echo "::error::Refusing to publish - SixLabors.Fonts is ${resolved:-missing} in $project; 2.x is revenue-gated."; exit 1 ;;
            esac
            echo "::endgroup::"
          done

      - name: Pack
        run: |
          dotnet pack ${{ env.PROJECT }} -c Release --no-build \
            -p:Version=${{ steps.v.outputs.version }} \
            -p:PackageVersion=${{ steps.v.outputs.version }}
          dotnet pack ${{ env.EXTENSIONS_PROJECT }} -c Release --no-build \
            -p:Version=${{ steps.v.outputs.version }} \
            -p:PackageVersion=${{ steps.v.outputs.version }}
          ls -la artifacts/

      - name: Verify package contents
        run: |
          python3 - "${{ steps.v.outputs.version }}" <<'PY'
          import glob, sys, zipfile
          version = sys.argv[1]

          packages = {
              'Ank.DocToolkit': [
                  'DocumentFormat.OpenXml', 'HtmlToOpenXml.dll', 'OfficeIMO.Word.Pdf', 'ClosedXML',
              ],
              'Ank.DocToolkit.Extensions.DependencyInjection': [
                  'Ank.DocToolkit', 'Microsoft.Extensions.DependencyInjection.Abstractions',
                  'Microsoft.Extensions.Options',
              ],
          }

          failures = []
          for pkg_id, deps in packages.items():
              hits = sorted(glob.glob(f'artifacts/{pkg_id}.{version}.nupkg'))
              if len(hits) != 1:
                  failures.append(f'{pkg_id}: expected exactly one nupkg for version {version}, found {hits}')
                  continue
              pkg = hits[0]
              z = zipfile.ZipFile(pkg)
              names = z.namelist()
              nuspec = z.read([n for n in names if n.endswith('.nuspec')][0]).decode('utf-8')

              for required in ['lib/net8.0/', 'lib/net10.0/', 'README.md', 'THIRD-PARTY-NOTICES.txt']:
                  ok = any(n.startswith(required) or n == required for n in names)
                  print(f'{pkg_id}: ' + ('OK   ' if ok else 'MISS ') + required)
                  if not ok: failures.append(f'{pkg_id}: missing {required}')

              for dep in deps:
                  ok = dep in nuspec
                  print(f'{pkg_id}: ' + ('OK   dep ' if ok else 'MISS dep ') + dep)
                  if not ok: failures.append(f'{pkg_id}: missing dep {dep}')

              if '<license type="expression">MIT' not in nuspec:
                  failures.append(f'{pkg_id}: missing MIT licence expression')
              if any(n.startswith('runtimes/') for n in names):
                  failures.append(f'{pkg_id}: runtimes/ - native payload in package')
              if f'<version>{version}</version>' not in nuspec:
                  failures.append(f'{pkg_id}: nuspec version is not {version}')

          if failures:
              sys.exit('package verification failed: ' + '; '.join(failures))
          print(f'\nboth packages verified at version {version}')
          PY

      # ---- the irreversible bit ----
      # The temporary key is valid for ONE hour, so it is requested here - after
      # every check has passed - rather than at the top of the job. One OIDC
      # exchange covers both packages: the key is scoped to the account, not to
      # a single package ID.
      #
      # This runs on dry runs TOO, deliberately: it is the only way to prove the
      # Trusted Publishing policy actually works without publishing. A dry run
      # that skipped it would pass while the policy was misconfigured, and the
      # failure would surface on the one run that cannot be undone.
      - name: NuGet login (OIDC exchange for a short-lived key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER || vars.NUGET_USER }}

      - name: Confirm the OIDC exchange produced a key
        run: |
          if [ -z "${{ steps.login.outputs.NUGET_API_KEY }}" ]; then
            echo "::error::OIDC exchange returned no key. Check: (a) permissions.id-token is 'write', (b) the nuget.org Trusted Publishing policy names owner '${{ github.repository_owner }}', repo '${{ github.event.repository.name }}' and workflow file 'release.yml', (c) NUGET_USER is your nuget.org profile name, not an email."
            exit 1
          fi
          echo "Trusted Publishing OK - short-lived key obtained (valid 1 hour)"

      - name: Push to nuget.org
        if: steps.v.outputs.publish == 'true'
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
          echo "published ${{ steps.v.outputs.version }} for both packages"

      # release-please (release-please.yml) already creates a GitHub Release with its own
      # generated notes when it pushes the tag, so this step attaches the built packages to
      # that existing release instead of failing on a duplicate. The --generate-notes path
      # below is the fallback for a manually-pushed tag, where no release exists yet.
      - name: Create or update GitHub Release
        if: steps.v.outputs.publish == 'true' && (github.event_name == 'push' || github.event_name == 'release')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists (created by release-please) - attaching packages"
            gh release upload "${GITHUB_REF_NAME}" artifacts/*.nupkg artifacts/*.snupkg --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              ${{ steps.v.outputs.prerelease == 'true' && '--prerelease' || '' }} \
              artifacts/*.nupkg artifacts/*.snupkg
          fi

      - name: Upload packages as build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-${{ steps.v.outputs.version }}
          path: artifacts/*
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Release ${{ steps.v.outputs.version }}"
            echo ""
            if [ "${{ steps.v.outputs.publish }}" = "true" ]; then
              echo "Published Ank.DocToolkit and Ank.DocToolkit.Extensions.DependencyInjection to nuget.org at the same version. Availability in search can lag by a few minutes."
            else
              echo "**Dry run** - packed and verified both packages, Trusted Publishing proven, nothing pushed."
            fi
            echo ""
            echo "- prerelease: ${{ steps.v.outputs.prerelease }}"
            echo "- guards: native binaries, banned packages, SixLabors.Fonts pin - all passed for both projects"
          } >> "$GITHUB_STEP_SUMMARY"
