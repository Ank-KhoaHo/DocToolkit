name: Install smoke test

# Proves a consumer can actually install and run the PUBLISHED packages.
#
# Nothing else here does that. `build & test` compiles the working tree; the samples reference the
# published package but build on a runner that may already have it cached, so they prove the API
# still compiles rather than that a fresh `dotnet add package` works. The gap this closes is real:
# a package can be published, indexed, and still unusable — a broken .nuspec dependency range, a
# missing lib/ folder for one target framework, an icon or readme path that fails validation.
#
# Deliberately does NOT check out the repository. A clean-machine test that uses repo files is not
# a clean-machine test: it would pick up global.json, Directory.Build.props and NuGet.config, none
# of which a consumer has. Everything below is created from nothing.
#
# ---------------------------------------------------------------------------------------------
# It verified the PREVIOUS release, every time, until 2026-08-23. Measured across the last eight:
#
#   v0.33.4 installed 0.33.3 · v0.33.3 installed 0.33.2 · v0.33.2 installed 0.33.1
#   v0.33.1 installed 0.33.0 · v0.33.0 installed 0.32.0 · v0.32.0 installed 0.31.1
#   v0.31.1 installed 0.31.0 · v0.31.0 installed 0.30.0
#
# Eight for eight — structural, not a flaky race. Both this workflow and release.yml fired on
# `release: published`, so they started together, and release.yml has to build, test, run every
# premise guard, pack and verify BEFORE it pushes. On v0.33.4 this job finished at 05:23:41 and
# the push happened at 05:25:34. This job could not win that race and never did.
#
# Two changes close it, and the second is the load-bearing one:
#
#   1. It now triggers on the Release workflow COMPLETING SUCCESSFULLY, not on the release event.
#      docs.yml already does exactly this, for the same reason.
#   2. It resolves the version it is supposed to verify and asserts it installed THAT — because
#      trigger order alone leaves it timing-dependent: nuget.org indexing lags the push by
#      minutes, so without the assertion it could still quietly fall back to the previous version
#      and go green. Without part 2 the fix would be unverifiable in the same way the original was.
#
# The weakness that produced this was not the race, it was that a green run never said WHICH
# version it tested. Every run now prints that to the job summary, pass or fail.
# ---------------------------------------------------------------------------------------------

on:
  # After the Release workflow finishes successfully, so the packages are actually pushed by the
  # time this starts. See the header for why `release: published` was wrong.
  #
  # Known gotcha, identical to docs.yml's: workflow_run fires based on this file's state on the
  # default branch when Release completes, so the first release after this merges is the first
  # one it can fire for. It cannot retroactively verify an earlier release.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Weekly, because it can also break without us doing anything — a delisted transitive dependency,
  # or a package validation change at nuget.org. A scheduled run has no particular version to
  # verify and checks whatever is newest, which is the right question to ask on a timer.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which version must this run verify? Split into its own job so the install job's steps stay
  # linear rather than every one of them carrying an `if:`.
  #
  # release.yml triggers on BOTH `push: tags` and `release: published`, so one release can produce
  # two Release runs and therefore two of these. That is safe — everything below is read-only
  # against nuget.org — and the concurrency group above cancels the older run anyway.
  resolve:
    name: resolve the version under test
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.expect.outputs.run }}
      version: ${{ steps.expect.outputs.version }}
    steps:
      - name: Resolve
        id: expect
        env:
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          if [ "$EVENT" != "workflow_run" ]; then
            # Scheduled or manual: no particular version is under test, verify whatever is newest.
            echo "run=true"    >> "$GITHUB_OUTPUT"
            echo "version="    >> "$GITHUB_OUTPUT"
            echo "No specific version under test ($EVENT) - will verify the newest published."
            exit 0
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "::notice::Release concluded '$CONCLUSION', so nothing was published. Nothing to verify."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For a tag build, workflow_run.head_branch carries the TAG name. A manual dry run of
          # release.yml carries a branch name instead, and publishes nothing - so there is no
          # version to verify and this correctly declines to invent one. A manual release WITH
          # publish ticked also lands here and is skipped; the weekly run covers it. Stated
          # rather than hidden, because a skip that looks like a pass is the failure this whole
          # workflow was just repaired for.
          case "$HEAD_BRANCH" in
            v[0-9]*)
              echo "run=true"                       >> "$GITHUB_OUTPUT"
              echo "version=${HEAD_BRANCH#v}"       >> "$GITHUB_OUTPUT"
              echo "Verifying ${HEAD_BRANCH#v}, from tag $HEAD_BRANCH."
              ;;
            *)
              echo "::notice::Release ran on '$HEAD_BRANCH', which is not a v* tag - no package was published for this run, so there is nothing to install."
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  install:
    name: install from nuget.org and run
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-24.04
    env:
      # Empty means "whatever is newest" - a scheduled or manual run. Non-empty means this run
      # must install exactly that version and fail if it cannot.
      EXPECTED: ${{ needs.resolve.outputs.version }}
    steps:
      # NuGet caching is deliberately NOT enabled here, and could not be: this job never
      # checks out the repository - see the header comment for why that is the point - so
      # cache-dependency-path would match no packages.lock.json and setup-dotnet's cache
      # step would fail outright. The "Use an empty NuGet cache" step below would bypass a
      # restored cache in any case, by pointing NUGET_PACKAGES at an empty directory. An
      # empty package folder IS this workflow's test.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.302

      # A fresh package folder, so a runner-cached copy cannot make this pass. This is the exact
      # weakness that stops the samples from covering it.
      - name: Use an empty NuGet cache
        run: echo "NUGET_PACKAGES=${{ runner.temp }}/empty-nuget-cache" >> "$GITHUB_ENV"

      # nuget.org indexing lags the push by minutes - measured on 0.12.0. Waiting is not
      # flakiness tolerance; the alternative is a job that fails for a reason that resolves
      # itself.
      #
      # It now waits for the EXACT version under test, on BOTH packages, rather than for the
      # feed to answer at all. That difference is the whole repair: the old loop was satisfied
      # by any version being present, which the previous release always satisfied instantly.
      - name: Wait for the packages to be indexed
        run: |
          set -uo pipefail

          index() { curl -sf "https://api.nuget.org/v3-flatcontainer/$1/index.json"; }

          if [ -n "$EXPECTED" ]; then
            echo "Waiting for $EXPECTED to appear for both packages."
          else
            echo "No specific version under test; waiting for the feed to answer."
          fi

          for attempt in $(seq 1 30); do
            core=$(index ank.doctoolkit || true)
            ext=$(index ank.doctoolkit.extensions.dependencyinjection || true)

            if [ -n "$EXPECTED" ]; then
              if printf '%s' "$core" | grep -q "\"$EXPECTED\"" \
                 && printf '%s' "$ext" | grep -q "\"$EXPECTED\""; then
                echo "both packages carry $EXPECTED after $attempt attempt(s)"
                exit 0
              fi
            elif printf '%s' "$core" | grep -q '"[0-9]'; then
              echo "index reachable after $attempt attempt(s)"
              printf '%s' "$core" | tail -c 200
              exit 0
            fi
            sleep 20
          done

          if [ -n "$EXPECTED" ]; then
            echo "::error::$EXPECTED is not on nuget.org for both packages after 10 minutes. This job must not fall back to an older version - that is the defect it was repaired for."
          else
            echo "::error::ank.doctoolkit is not on nuget.org after 10 minutes."
          fi
          exit 1

      # `dotnet new console` in a temp directory, outside any checkout, is what a consumer starting
      # from nothing actually does.
      - name: Create an empty project and install the DI package alone
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/consumer" && cd "${{ runner.temp }}/consumer"
          dotnet new console -o app
          cd app
          # Added ALONE, deliberately: the core package must arrive transitively. Adding both at
          # once would hide a broken dependency range in the .nuspec.
          if [ -n "$EXPECTED" ]; then
            dotnet add package Ank.DocToolkit.Extensions.DependencyInjection --version "$EXPECTED"
          else
            dotnet add package Ank.DocToolkit.Extensions.DependencyInjection
          fi

      # Two different claims, and only the first is about transitivity.
      #
      # The extensions package declares a FLOOR on the core package, and NuGet resolves a floor to
      # the LOWEST satisfying version - so a consumer who installs only the DI package gets the
      # oldest core it still supports, not the newest. Measured 2026-08-08 with extensions 0.12.0:
      # they get core 0.11.0. That is the documented, deliberate consequence of floors (raising one
      # narrows who can consume the package), but it means a DI-only consumer does NOT automatically
      # get the newest API - which is worth failing loudly on if core ever stops arriving at all.
      # The version it arrives AS is reported to the job summary, not just echoed into a log
      # nobody opens. That is C24: the lag is deliberate and must not fail the build, but it is
      # surprising enough that it should be visible here rather than discovered in somebody's
      # project. Measured 2026-08-15: extensions 0.27.0 resolves core 0.26.0.
      #
      # Never fails on the lag itself. A floor is a compatibility decision - raising one narrows
      # who can consume the package - so "behind" is the designed behaviour, not a defect. It
      # fails only if core does not arrive at all, which IS a broken .nuspec.
      - name: Assert the core package arrives transitively, and report which version
        run: |
          set -uo pipefail
          cd "${{ runner.temp }}/consumer/app"
          dotnet list package --include-transitive > graph.txt
          cat graph.txt

          # The resolved version is the LAST field on the line, because a transitive entry has two
          # columns (package, resolved) where a top-level one has three (package, requested,
          # resolved). Matching $2 exactly avoids also matching the extensions package, whose name
          # starts with the same string.
          resolved=$(awk '$2 == "Ank.DocToolkit" { print $NF }' graph.txt | head -1)

          if [ -z "$resolved" ]; then
            echo "::error::Ank.DocToolkit did not arrive transitively through the extensions package. Its .nuspec dependency on the core package is broken."
            exit 1
          fi

          newest=$(curl -sf https://api.nuget.org/v3-flatcontainer/ank.doctoolkit/index.json \
                   | tr ',' '\n' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)

          {
            echo "### Installing the DI package alone"
            echo
            echo "| | Version |"
            echo "|---|---|"
            echo "| Core that a DI-only consumer receives | \`$resolved\` |"
            echo "| Newest core published | \`${newest:-unknown}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$newest" ] && [ "$resolved" != "$newest" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Installing **only** \`Ank.DocToolkit.Extensions.DependencyInjection\` gives core \`$resolved\`, not \`$newest\` - NuGet resolves a floor to the LOWEST satisfying version. That is deliberate, and it means a DI-only consumer does not automatically get the newest API. Add \`Ank.DocToolkit\` explicitly to move forward." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::A DI-only install resolves core $resolved, while $newest is published."
          fi

      # Now add the core package explicitly, so the program below can exercise the CURRENT API.
      # Without this it would compile against whatever the floor resolved to, and a test of the
      # newest release would silently be testing an older one.
      - name: Add the core package explicitly
        run: |
          set -euo pipefail
          cd "${{ runner.temp }}/consumer/app"
          if [ -n "$EXPECTED" ]; then
            dotnet add package Ank.DocToolkit --version "$EXPECTED"
          else
            dotnet add package Ank.DocToolkit
          fi
          dotnet add package Microsoft.Extensions.DependencyInjection
          dotnet list package

      # The load-bearing half of the repair. Everything above can succeed against the WRONG
      # version - that is exactly what happened eight releases running - so the versions actually
      # resolved are read back and compared to the one this run exists to verify.
      #
      # It reports what it tested on every run, including scheduled ones where there is nothing
      # to compare against. A green check that does not say which artefact it tested is the
      # failure this workflow already shipped once.
      - name: Assert it installed the version this run is verifying
        run: |
          set -uo pipefail
          cd "${{ runner.temp }}/consumer/app"
          dotnet list package > top.txt
          cat top.txt

          # Top-level entries have three columns after the marker: package, requested, resolved.
          core=$(awk '$2 == "Ank.DocToolkit" { print $NF }' top.txt | head -1)
          ext=$(awk '$2 == "Ank.DocToolkit.Extensions.DependencyInjection" { print $NF }' top.txt | head -1)

          {
            echo "### Versions actually installed"
            echo
            echo "| Package | Installed |"
            echo "|---|---|"
            echo "| \`Ank.DocToolkit\` | \`${core:-none}\` |"
            echo "| \`Ank.DocToolkit.Extensions.DependencyInjection\` | \`${ext:-none}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$EXPECTED" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No specific version under test (scheduled or manual run), so nothing is asserted about which version this is - only that it installs and runs." >> "$GITHUB_STEP_SUMMARY"
            echo "Scheduled/manual run: installed core $core, extensions $ext."
            exit 0
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Verifying release \`$EXPECTED\`." >> "$GITHUB_STEP_SUMMARY"

          failed=0
          if [ "$core" != "$EXPECTED" ]; then
            echo "::error::Expected to verify core $EXPECTED but installed '${core:-none}'. This job must test the release it ran for."
            failed=1
          fi
          if [ "$ext" != "$EXPECTED" ]; then
            echo "::error::Expected to verify extensions $EXPECTED but installed '${ext:-none}'. Both packages publish at the same version from one release run."
            failed=1
          fi
          [ "$failed" -eq 0 ] || exit 1

          echo "Both packages installed at $EXPECTED, which is the release this run was triggered by."

      - name: Write a program that uses every capability
        run: |
          cat > "${{ runner.temp }}/consumer/app/Program.cs" <<'PROGRAM'
          using DocToolkit;
          using DocToolkit.Extensions.DependencyInjection;
          using Microsoft.Extensions.DependencyInjection;

          static void Check(bool ok, string what)
          {
              Console.WriteLine($"{(ok ? "ok  " : "FAIL")} {what}");
              if (!ok) Environment.Exit(1);
          }

          // Static API, straight from the transitively-arrived core package.
          byte[] docx = DocxEditor.Create(new[] { DocxBlock.Paragraph("Hello from a fresh install.") });
          Check(DocxEditor.ExtractText(docx).Contains("fresh install"), "DocxEditor.Create + ExtractText");

          byte[] xlsx = WorkbookEditor.Create(new[]
          {
              XlsxSheet.Named("S", new[] { new object?[] { "n", 41 } }),
          });
          Check(WorkbookEditor.ReadCell(xlsx, "S", "B1") == "41", "WorkbookEditor.Create(sheets)");

          byte[] pptx = PresentationEditor.Create(new[] { PptxSlide.Titled("Title", "bullet") });
          Check(PresentationEditor.SlideCount(pptx) == 1, "PresentationEditor.Create");

          byte[] pdf = DocxToPdfConverter.Convert(docx);
          Check(pdf.Length > 1000 && pdf[0] == (byte)'%', "DocxToPdfConverter.Convert");

          // The DI package, through a real container.
          var provider = new ServiceCollection().AddDocToolkit().BuildServiceProvider();
          var editor = provider.GetRequiredService<IWorkbookEditor>();
          Check(editor.ReadCell(xlsx, "S", "B1") == "41", "IWorkbookEditor resolved from the container");

          Console.WriteLine("A fresh install of both packages works.");
          PROGRAM
          cd "${{ runner.temp }}/consumer/app" && dotnet run -c Release

      # The premise a consumer is buying. Checked here rather than only in the repo's own build,
      # because this is the graph THEY get.
      - name: Assert the consumer's output has no native binaries
        run: |
          cd "${{ runner.temp }}/consumer/app"
          mapfile -t native < <(find . -path '*/bin/*' \
            \( -name '*.so' -o -name '*.so.*' -o -name '*.dylib' \) -print)
          printf 'native binaries in a consumer build: %d\n' "${#native[@]}"
          if [ "${#native[@]}" -ne 0 ]; then
            printf '  %s\n' "${native[@]}"
            echo "::error::The published packages put native binaries into a consumer's output."
            exit 1
          fi
