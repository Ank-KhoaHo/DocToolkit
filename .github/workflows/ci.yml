name: CI

# Closes the one constraint that could never be verified locally: Linux.
# DocToolkit's whole premise is "permissive licences, NuGet-only, no native
# binaries, runs on Linux". Every one of those is a property of the resolved
# dependency graph, so a single upstream bump can silently break it. These
# jobs re-prove them on every push rather than trusting a point-in-time check.

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: DocToolkit.sln
  PROJECT: src/DocToolkit/DocToolkit.csproj
  EXTENSIONS_PROJECT: src/DocToolkit.Extensions.DependencyInjection/DocToolkit.Extensions.DependencyInjection.csproj

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is the point of this workflow; windows guards against
        # accidentally depending on Linux-only behaviour in the fix.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # Both SDKs: the projects multi-target net8.0;net10.0.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      # -warnaserror keeps the build at the 0 warnings it ships with. If this
      # fails, treat it as signal: either new code introduced a warning, or a
      # dependency picked up a security advisory. Both are worth a red build.
      - name: Build (warnings are errors)
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }} -c Release --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=${{ matrix.os }}.trx"
          --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn

      # Uploaded once, not once per OS: windows-latest exists in this matrix to catch
      # Linux-only assumptions, not to double-report identical coverage numbers.
      # token is optional - see CODECOV_TOKEN note in the design doc if this step
      # ever starts failing with a token-required error.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The design premise, re-proven from the resolved graph on Linux.
  # Kept separate so a failure here is unambiguous: it is never a test bug.
  premise-guard:
    name: no native binaries / no banned packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The other premise guards check WHAT the resolved graph contains. This one
      # checks it is the graph we agreed to. --locked-mode fails rather than
      # silently re-resolving, so an upstream bump cannot enter a release without
      # a lockfile change that someone reviewed.
      #
      # Runs before Build because Build's implicit restore would otherwise
      # re-resolve first. Restores the two packable projects individually rather
      # than the solution: tests/ and samples/ deliberately carry no lockfile
      # (see docs/2026-08-03-dependency-automation-design.md), and a
      # solution-wide --locked-mode would be ambiguous about them.
      - name: Assert the resolved graph matches the committed lockfiles
        run: |
          for project in "$PROJECT" "$EXTENSIONS_PROJECT"; do
            echo "::group::$project"
            if ! dotnet restore "$project" --locked-mode; then
              echo "::error::$project restored differently from its committed packages.lock.json. If the dependency change is intended, run 'dotnet restore $project --force-evaluate' and commit the updated lockfile."
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release

      # SkiaSharp and Magick.NET arrived once via ShapeCrawler and cost a
      # rewrite. Matches versioned sonames (libfoo.so.1) as well as *.so.
      - name: Assert zero native binaries
        run: |
          mapfile -t native < <(find . -path '*/bin/*' \
            \( -name '*.so' -o -name '*.so.*' -o -name '*.dylib' \) -print)
          printf 'native binaries found: %d\n' "${#native[@]}"
          if [ "${#native[@]}" -ne 0 ]; then
            printf '  %s\n' "${native[@]}"
            echo "::error::Native binaries in build output - the no-native-dependency premise is broken."
            exit 1
          fi

      - name: Assert no banned packages in the resolved graph
        run: |
          banned='EPPlus|NPOI|Spire\.|Syncfusion|QuestPDF|IronPDF|ShapeCrawler|SkiaSharp|Magick\.NET|System\.Drawing\.Common'
          for project in "$PROJECT" "$EXTENSIONS_PROJECT"; do
            echo "::group::$project"
            dotnet list "$project" package --include-transitive > graph.txt
            cat graph.txt
            if grep -Eiq "$banned" graph.txt; then
              grep -Ei "$banned" graph.txt
              echo "::error::A banned package is in the dependency graph of $project."
              exit 1
            fi
            echo "no banned packages"
            echo "::endgroup::"
          done

      # 2.x switches to the Six Labors Split License (Apache-2.0 only under
      # $1M revenue). Pinned to [1.0.0]; this asserts the pin actually held.
      - name: Assert SixLabors.Fonts stayed on 1.x
        run: |
          for project in "$PROJECT" "$EXTENSIONS_PROJECT"; do
            echo "::group::$project"
            resolved=$(dotnet list "$project" package --include-transitive \
              | grep -i 'SixLabors.Fonts' | awk '{print $NF}' | sort -u | head -1)
            echo "SixLabors.Fonts resolved: ${resolved:-<not found>}"
            case "$resolved" in
              1.*) echo "ok - permissive Apache-2.0 line" ;;
              *)   echo "::error::SixLabors.Fonts is ${resolved:-missing} in $project; 2.x is revenue-gated."; exit 1 ;;
            esac
            echo "::endgroup::"
          done

  # Enforces Conventional Commits so release-please's version-bump and changelog inference
  # (release-please-config.json) is never silently wrong. Checks every commit in the PR's
  # range, not just the PR title, because this repo true-merges - every individual commit
  # lands on main and matters to release-please's bump calculation.
  commit-format:
    name: commit message format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert every commit in this PR follows Conventional Commits
        run: |
          regex='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+$'
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"
            # GitHub's own PR-merge commits are generated, never hand-written, so
            # they are exempt. A hand-made "Merge branch 'main' into feat/x" is NOT
            # exempt - that one still fails, which is the guard we want to keep.
            # Rebase onto main instead of merging it into a feature branch.
            if [[ "$subject" =~ ^Merge\ pull\ request\ \#[0-9]+\ from\  ]]; then
              continue
            fi
            if ! [[ "$subject" =~ $regex ]]; then
              echo "::error::Commit $sha does not match Conventional Commits format (type(scope)?: description): \"$subject\""
              bad=1
            fi
          done < <(git log --format='%H %s' "$base..$head")
          if [ "$bad" -ne 0 ]; then
            echo "::error::One or more commits do not follow Conventional Commits format."
            exit 1
          fi
          echo "all commits in this PR match Conventional Commits format"

  # Proves the docs site actually builds before it can reach docs.yml, which only
  # runs after an irreversible nuget publish - a bad docfx.json edit or doc-comment
  # regression should fail here, not surface after release.
  docs-build:
    name: build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install DocFX
        run: dotnet tool update -g docfx --version 2.78.5

      # --warningsAsErrors catches a regression like the InvalidFileLink warning
      # this pipeline hit once already (see docfx/index.md's xref: links).
      - name: Build docs site
        run: docfx docfx/docfx.json --warningsAsErrors

  # Proves the artifacts consumers actually install are correct - not just that
  # the solution compiles. Catches missing TFMs and metadata regressions.
  package:
    name: pack & verify .nupkg (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            project: src/DocToolkit/DocToolkit.csproj
            deps: "DocumentFormat.OpenXml,HtmlToOpenXml.dll,OfficeIMO.Word.Pdf,ClosedXML"
          - name: extensions
            project: src/DocToolkit.Extensions.DependencyInjection/DocToolkit.Extensions.DependencyInjection.csproj
            deps: "Ank.DocToolkit,Microsoft.Extensions.DependencyInjection.Abstractions,Microsoft.Extensions.Options"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: dotnet pack ${{ matrix.project }} -c Release

      - name: Verify package contents
        env:
          EXPECTED_DEPS: ${{ matrix.deps }}
        run: |
          python3 - <<'PY'
          import glob, os, sys, zipfile
          deps = os.environ['EXPECTED_DEPS'].split(',')
          hits = glob.glob('artifacts/*.nupkg')
          if not hits:
              sys.exit('no .nupkg produced')
          pkg = hits[0]
          print('package:', pkg)
          z = zipfile.ZipFile(pkg)
          names = z.namelist()
          nuspec = z.read([n for n in names if n.endswith('.nuspec')][0]).decode('utf-8')

          failures = []
          for required in ['README.md', 'THIRD-PARTY-NOTICES.txt']:
              ok = required in names
              print(('OK   ' if ok else 'MISS ') + required)
              if not ok:
                  failures.append(required)

          has_net8 = any(n.startswith('lib/net8.0/') for n in names)
          has_net10 = any(n.startswith('lib/net10.0/') for n in names)
          print(('OK   ' if has_net8 else 'MISS ') + 'lib/net8.0/')
          print(('OK   ' if has_net10 else 'MISS ') + 'lib/net10.0/')
          if not has_net8: failures.append('lib/net8.0/')
          if not has_net10: failures.append('lib/net10.0/')

          for dep in deps:
              ok = dep in nuspec
              print(('OK   dep ' if ok else 'MISS dep ') + dep)
              if not ok:
                  failures.append('dep ' + dep)

          if '<license type="expression">MIT' not in nuspec:
              failures.append('MIT licence expression')
          if any(n.startswith('runtimes/') for n in names):
              failures.append('runtimes/ present - native payload in package')

          if failures:
              sys.exit('package verification failed: ' + ', '.join(failures))
          print('\npackage verified')
          PY

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-${{ matrix.name }}
          path: artifacts/*.nupkg
          if-no-files-found: error
