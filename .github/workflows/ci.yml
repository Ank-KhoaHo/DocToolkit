name: CI

# Closes the one constraint that could never be verified locally: Linux.
# DocToolkit's whole premise is "permissive licences, NuGet-only, no native
# binaries, runs on Linux". Every one of those is a property of the resolved
# dependency graph, so a single upstream bump can silently break it. These
# jobs re-prove them on every push rather than trusting a point-in-time check.

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
    # `edited` is not in the default set (opened, synchronize, reopened), and commit-format
    # asserts on the PULL REQUEST TITLE - a field that only the edited event reports. Without
    # it the guard watches a mutable value on the one event set that never sees it change,
    # which failed in both directions: a corrected title could not go green without an
    # unrelated push, and a PR opened with a good title could be edited to a bad one and
    # merged green. Squash merge uses COMMIT_OR_PR_TITLE, so that title reaches main.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# Least privilege, matching docs.yml, release.yml and codeql.yml rather than
# inheriting the repository default. Nothing here writes to the repository: the
# jobs check out, build, test, pack and upload artifacts. Artifact upload and the
# Codecov upload both authenticate on their own - upload-artifact through the
# runtime's artifact service, Codecov through CODECOV_TOKEN - so neither needs a
# scope on GITHUB_TOKEN. commit-format reads history from the checkout, not the
# API. If a job ever does need to write, give the scope to that job rather than
# widening this.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: DocToolkit.sln
  PROJECT: src/DocToolkit/DocToolkit.csproj
  EXTENSIONS_PROJECT: src/DocToolkit.Extensions.DependencyInjection/DocToolkit.Extensions.DependencyInjection.csproj

jobs:
  build-test:
    # The name deliberately carries the PLATFORM, not the runner image. Branch
    # protection requires status checks BY NAME, so `build & test (${{ matrix.os }})`
    # made the required-check name a function of the runner version: pinning the
    # image below renamed the check to one protection had never heard of, and a
    # required check that never reports blocks every PR forever - including the one
    # doing the pinning. Decoupling the label is what lets the image be repinned
    # (24.04 -> 26.04) without touching repository settings at all.
    name: build & test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is the point of this workflow; windows guards against
        # accidentally depending on Linux-only behaviour in the fix.
        #
        # Pinned to ubuntu-24.04, not ubuntu-latest, because README.md states
        # "Verified in CI on ubuntu-24.04, not inferred" - and `latest` is an
        # alias GitHub repoints on its own schedule. While the alias happens to
        # resolve to 24.04 the two agree, so the day it moves to 26.04 the claim
        # would go quietly false with nothing failing. Naming the version is what
        # makes the README a checkable statement rather than a hopeful one.
        #
        # macos and linux-arm64 exist because "pure managed, no native binaries"
        # implies every platform .NET runs on, and until they were added nothing
        # proved it on any CPU but x64 or any OS but Linux and Windows. The two
        # cover different halves of that claim and neither substitutes for the
        # other: macos-latest is Apple Silicon, so it proves arm64 AND macOS at
        # once, while ubuntu-24.04-arm proves the architecture consumers actually
        # deploy to - Linux arm64 containers on Graviton and Ampere.
        #
        # macos-latest is deliberately NOT pinned, and that is consistent with the
        # paragraph above rather than an exception to it: the ubuntu pin exists to
        # keep a README sentence naming a version honest. No claim here names a
        # macOS version, so `latest` proves exactly what is claimed and needs no
        # maintenance when GitHub retires an image.
        include:
          - label: linux
            os: ubuntu-24.04
          - label: windows
            os: windows-latest
          - label: macos
            os: macos-latest
          - label: linux-arm64
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both SDKs: the projects multi-target net8.0;net10.0.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.302
          # Keyed on the two src/ packages.lock.json files - the only lockfiles in the
          # tree, because RestorePackagesWithLockFile is set in src/Directory.Build.props
          # and tests/ and samples/ do not inherit it. Ephemeral runners otherwise
          # re-download the whole closure (ClosedXML, OpenXml, OfficeIMO, HtmlToOpenXml)
          # on every job of every run.
          #
          # This is NOT a build-speed optimisation, and do not defend it as one. Measured
          # 2026-08-08, cold vs warm on the same commit: dotnet restore got faster
          # (windows 18s->10s, macos 5s->2s, linux 9s->8s), but setup-dotnet got slower in
          # all ten jobs because it now downloads a 222 MB archive, and the whole run went
          # 175s -> 187s. The justification is traffic, not time - CI's own restores were
          # dominating this package's nuget.org download statistics, which is what made
          # "does anyone actually use this?" unanswerable.
          #
          # It does NOT disarm the samples' Version="*" canary. `*` is a floating version
          # with no lockfile pinning it, so NuGet still queries the feed to resolve what
          # `*` means; a genuinely new release is not in the cache and is still fetched.
          # The cache suppresses re-downloads, not resolution.
          #
          # Known residual, same root cause: `*` is not part of the cache key, and
          # actions/cache does not re-save when the key hits exactly - measured, ten
          # restores and zero saves. So a newly published Ank.DocToolkit is re-fetched by
          # every samples-restoring job until the key rotates. That window closes when the
          # extensions floor is bumped to the new version, which puts it in
          # packages.lock.json and therefore in the key. Between a release and that bump,
          # expect our own package to keep appearing in the download statistics.
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      # -warnaserror keeps the build at the 0 warnings it ships with. If this
      # fails, treat it as signal: either new code introduced a warning, or a
      # dependency picked up a security advisory. Both are worth a red build.
      - name: Build (warnings are errors)
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }} -c Release --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=${{ matrix.os }}.trx"
          --results-directory ${{ github.workspace }}/TestResults

      # The gate, and deliberately not Codecov's. Codecov's own statuses would put a
      # third-party service in the merge path of a repository that pins its SDK, pins
      # every action by SHA and restores with --locked-mode; codecov.yml keeps that
      # signal arriving but marks it informational. This step is what can go red.
      #
      # Linux only, for the same reason the Codecov upload is: the other three runners
      # exist to catch platform-specific assumptions, not to re-measure identical
      # coverage numbers three more times.
      - name: Assert coverage has not regressed
        if: matrix.label == 'linux'
        run: python3 scripts/check-coverage.py "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn

      # Uploaded once, not once per OS: windows-latest exists in this matrix to catch
      # Linux-only assumptions, not to double-report identical coverage numbers.
      # token is optional - see CODECOV_TOKEN note in the design doc if this step
      # ever starts failing with a token-required error.
      - name: Upload coverage to Codecov
        if: matrix.label == 'linux'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The design premise, re-proven from the resolved graph on Linux.
  # Kept separate so a failure here is unambiguous: it is never a test bug.
  premise-guard:
    name: no native binaries / no banned packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.302
          # Same cache as the build & test job above; see that block for the measured
          # effect and for why this does not disarm the samples' Version="*" canary.
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # The other premise guards check WHAT the resolved graph contains. This one
      # checks it is the graph we agreed to. --locked-mode fails rather than
      # silently re-resolving, so an upstream bump cannot enter a release without
      # a lockfile change that someone reviewed.
      #
      # Runs before Build because Build's implicit restore would otherwise
      # re-resolve first. Restores the two packable projects individually rather
      # than the solution: tests/ and samples/ deliberately carry no lockfile
      # (lockfiles are committed for the two packable projects only), and a
      # solution-wide --locked-mode would be ambiguous about them.
      - name: Assert the resolved graph matches the committed lockfiles
        run: |
          for project in "$PROJECT" "$EXTENSIONS_PROJECT"; do
            echo "::group::$project"
            if ! dotnet restore "$project" --locked-mode; then
              echo "::error::$project restored differently from its committed packages.lock.json. If the dependency change is intended, run 'dotnet restore $project --force-evaluate' and commit the updated lockfile."
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release

      # SkiaSharp and Magick.NET arrived once via ShapeCrawler and cost a
      # rewrite. Matches versioned sonames (libfoo.so.1) as well as *.so.
      - name: Assert zero native binaries
        run: |
          mapfile -t native < <(find . -path '*/bin/*' \
            \( -name '*.so' -o -name '*.so.*' -o -name '*.dylib' \) -print)
          printf 'native binaries found: %d\n' "${#native[@]}"
          if [ "${#native[@]}" -ne 0 ]; then
            printf '  %s\n' "${native[@]}"
            echo "::error::Native binaries in build output - the no-native-dependency premise is broken."
            exit 1
          fi

      - name: Assert no banned packages in the resolved graph
        run: |
          banned='EPPlus|NPOI|Spire\.|Syncfusion|QuestPDF|IronPDF|ShapeCrawler|SkiaSharp|Magick\.NET|System\.Drawing\.Common'
          for project in "$PROJECT" "$EXTENSIONS_PROJECT"; do
            echo "::group::$project"
            dotnet list "$project" package --include-transitive > graph.txt
            cat graph.txt
            if grep -Eiq "$banned" graph.txt; then
              grep -Ei "$banned" graph.txt
              echo "::error::A banned package is in the dependency graph of $project."
              exit 1
            fi
            echo "no banned packages"
            echo "::endgroup::"
          done

      # 2.x switches to the Six Labors Split License (Apache-2.0 only under
      # $1M revenue). DocToolkit.csproj pins an exact 1.0.x version - currently
      # [1.0.1]; read the csproj rather than trusting this line, which said
      # [1.0.0] for some time after the pin moved. The assertion below is on the
      # 1.x MAJOR precisely so a patch bump does not have to touch it.
      - name: Assert SixLabors.Fonts stayed on 1.x
        run: |
          for project in "$PROJECT" "$EXTENSIONS_PROJECT"; do
            echo "::group::$project"
            resolved=$(dotnet list "$project" package --include-transitive \
              | grep -i 'SixLabors.Fonts' | awk '{print $NF}' | sort -u | head -1)
            echo "SixLabors.Fonts resolved: ${resolved:-<not found>}"
            case "$resolved" in
              1.*) echo "ok - permissive Apache-2.0 line" ;;
              *)   echo "::error::SixLabors.Fonts is ${resolved:-missing} in $project; 2.x is revenue-gated."; exit 1 ;;
            esac
            echo "::endgroup::"
          done

      # The steps above assert that no BANNED package is present. None of them say
      # anything about what the packages that ARE present are licensed under - that
      # claim lived only in two hand-maintained text files and a hand-counted line
      # in README.md, and had already drifted in all three.
      #
      # Runs here rather than in its own job because it needs the restored packages:
      # licences are read from each package's own .nuspec in the NuGet cache, which
      # the --locked-mode restore at the top of this job has already populated.
      - name: Assert THIRD-PARTY-NOTICES.txt matches the resolved graph
        run: python3 scripts/gen-third-party-notices.py --check

  # Each packable csproj carries <AssemblyMetadata Include="IsTrimmable" Value="True" />, which
  # tells consumers these assemblies survive trimming.
  #
  # It is an AssemblyMetadata ITEM in the csproj, NOT an <IsTrimmable> property, and NOT in
  # src/Directory.Build.props. Both alternatives were tried and both broke the build: the property
  # makes the SDK inject a Microsoft.NET.ILLink.Tasks PackageReference at whatever version that
  # SDK bundles, which fails --locked-mode with NU1004 on any SDK patch difference between two
  # machines; and the item cannot sit in Directory.Build.props at all, where it makes multi-target
  # framework inference fail with NETSDK1013. See DocToolkit.csproj, which records both.
  #
  # That claim is about the WHOLE reachable graph at publish time, and the trim
  # analyzer running over our own source cannot make it - it never sees ClosedXML, OpenXML,
  # HtmlToOpenXml or OfficeIMO. Checking our API and not our dependencies is precisely the mistake
  # that let ShapeCrawler in.
  #
  # So this job publishes a real trimmed application over the real closure and RUNS it. Trim
  # breakage does not surface as a build failure: the trimmer removes a type something looks up by
  # name, and the app throws - or silently produces an empty document - at runtime only.
  # Dockerfile.linux-test is documented as *the* Linux check, and until now nothing ran it - so it
  # was broken more often than it was correct, silently. Measured twice: PR #107 moved properties
  # into a root Directory.Build.props without adding it to the image's COPY list, breaking the
  # container build for a day, and the SDK pin needed that COPY list changed again. Both were found
  # by reading the file, which is not a process.
  #
  # This is NOT a duplicate of `build & test (linux)`. That job runs on a GitHub runner with the SDK
  # preinstalled and the repository's whole working tree present. This one builds a clean image from
  # mcr.microsoft.com/dotnet/sdk and copies in only what the Dockerfile lists, so it is the only
  # thing that proves the container story a consumer actually deploys into - including that the COPY
  # list is complete.
  linux-container:
    name: linux container build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image pins the same SDK as global.json. If those drift, this build fails with
      # "a compatible .NET SDK was not found" - which is the point, not a nuisance.
      - name: Build the image
        run: docker build -f Dockerfile.linux-test -t doctoolkit-linux-test .

      # The Dockerfile's CMD runs the full suite. Building the image only proves it restores; a
      # container that builds and then fails every test would pass a build-only check.
      - name: Run the suite inside the container
        run: docker run --rm doctoolkit-linux-test

      # samples/Container is the consumer-facing half of the same claim: a plain runtime image
      # with no SDK, no LibreOffice, no browser and no fonts. Built AND RUN, with the network
      # disabled, because a Dockerfile that has never been built is a claim rather than a sample -
      # and this one already had a real bug found that way (it targeted runtime-deps, which ships
      # no .NET runtime and cannot host a framework-dependent app).
      - name: Build and run the container sample, offline
        run: |
          docker build -f samples/Container/Dockerfile -t doctoolkit-sample .
          docker run --rm --network none doctoolkit-sample

  trim-guard:
    name: trimmed app publishes and runs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.302
          # Same cache as the build & test job above; see that block for the measured
          # effect and for why this does not disarm the samples' Version="*" canary.
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Trim-publish the probe
        run: |
          dotnet publish tests/TrimProbe -c Release -r linux-x64 --nologo 2>&1 | tee trim.log
          test "${PIPESTATUS[0]}" -eq 0

      # Attribution matters more than the count. A warning from ClosedXML is a fact about a
      # dependency we do not control and must not fail the build; a warning naming DocToolkit is
      # ours and must.
      #
      # The sed is load-bearing: MSBuild appends " [/path/to/TrimProbe.csproj]" to every diagnostic,
      # and that path contains the string "DocToolkit" - so grepping the raw line for our name
      # matches EVERY warning, including the dependency ones. Verified by mutation: an
      # Activator.CreateInstance added to PptxSlide.Titled is reported as
      # "IL2072: DocToolkit.PptxSlide.Titled" and fails this step, while the ClosedXML warning
      # alone passes it.
      - name: Assert no trim warning belongs to DocToolkit
        run: |
          stripped=$(sed 's/ \[[^][]*\.csproj\]$//' trim.log)
          ours=$(echo "$stripped" | grep -oE "IL[0-9]+: DocToolkit\.[A-Za-z0-9_.<>]*" || true)
          others=$(echo "$stripped" | grep -oE "IL[0-9]+: [A-Za-z0-9_]+" | grep -v ': DocToolkit' | sort -u || true)

          echo "::group::trim warnings from dependencies (reported, not fatal)"
          echo "${others:-none}"
          echo "::endgroup::"

          if [ -n "$ours" ]; then
            echo "::error::DocToolkit's own code produced trim warnings, so the IsTrimmable claim in src/Directory.Build.props is no longer true:"
            echo "$ours"
            exit 1
          fi
          echo "no trim warnings attributable to DocToolkit"

      # The step that actually earns the claim. Every capability asserts on its result, so a
      # trimmed-away type surfaces here rather than in a consumer's production logs.
      - name: Run the trimmed application
        run: ./tests/TrimProbe/bin/Release/net8.0/linux-x64/publish/TrimProbe

  # Enforces Conventional Commits so release-please's version-bump and changelog inference
  # (release-please-config.json) is never silently wrong. Checks every commit in the PR's
  # range, not just the PR title, because this repo true-merges - every individual commit
  # lands on main and matters to release-please's bump calculation.
  commit-format:
    name: commit message format
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # THE PULL REQUEST TITLE IS NOW A COMMIT SUBJECT, so it is checked like one.
      #
      # This repository squash-merges. A squash commit's subject is the PR title whenever
      # the branch holds more than one commit, so an unparseable title means release-please
      # discards the WHOLE commit - body included - and every feat: line in it is lost.
      #
      # That is not hypothetical. Measured 2026-08-10: PR #189 shipped the entire headers
      # and footers feature under the title 'Headers and footers on generated documents',
      # and 0.19.0's changelog records only the unrelated PR that happened to share the
      # release. The feature is in the package with nothing announcing it, and a published
      # release's notes cannot be rewritten.
      #
      # CONTRIBUTING.md used to say the opposite - omit the prefix - and it was right while
      # this repo used merge commits, where the title lands in the BODY beside the real
      # commits and duplicates them. Squash inverted that. The advice was updated in the
      # same commit as this check, because advice alone had already failed twice.
      - name: Assert the pull request title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          regex='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+$'

          if ! [[ "$PR_TITLE" =~ $regex ]]; then
            echo "::error::The pull request title is not a Conventional Commit: '$PR_TITLE'"
            echo "::error::This repo squash-merges, so this title becomes the commit subject on main."
            echo "::error::release-please cannot parse it, and would silently drop every change in"
            echo "::error::this PR from the changelog - exactly what happened to #189 in 0.19.0."
            exit 1
          fi

          echo "PR title parses: $PR_TITLE"

      - name: Assert every commit in this PR follows Conventional Commits
        run: |
          regex='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+$'
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          # Merge commits are exempt, identified STRUCTURALLY by parent count rather
          # than by matching their subject text.
          #
          # Git writes a merge commit's subject itself and no type prefix is possible,
          # so failing one punishes the author for a message they did not write. The
          # earlier version exempted only "Merge pull request #N from ...", which left
          # the guard firing on three everyday operations that all merge main into a
          # branch and word it differently:
          #
          #   git merge main       -> "Merge branch 'main' into feat/x"
          #   git pull             -> "Merge branch 'main' of https://github.com/..."
          #   gh pr update-branch  -> "Merge branch 'main' into feat/x"
          #
          # Text matching needs a new pattern for each and keeps missing new ones.
          # Parent count cannot drift: two or more parents means git generated it.
          #
          # Safe for the reason this job exists at all - release-please skips commits
          # it cannot parse (visible in its own logs as "commit could not be parsed"),
          # so an unparseable merge subject never affects the computed version bump.
          #
          # Rebasing onto main is still preferred for readable history. This stops
          # enforcing that preference through a mechanism meant for release correctness.
          merges=" $(git rev-list --merges "$base..$head" | tr '\n' ' ') "

          bad=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"
            if [[ "$merges" == *" $sha "* ]]; then
              echo "skip (merge commit, subject generated by git): $subject"
              continue
            fi
            if ! [[ "$subject" =~ $regex ]]; then
              echo "::error::Commit $sha does not match Conventional Commits format (type(scope)?: description): \"$subject\". Amend it, or rebase to drop it. Use feat: for a new capability, fix: for a bug fix, docs:/ci:/test:/chore: otherwise - the type decides the version bump and the changelog section."
              bad=1
            fi
          done < <(git log --format='%H %s' "$base..$head")

          if [ "$bad" -ne 0 ]; then
            echo "::error::One or more commits do not follow Conventional Commits format."
            exit 1
          fi
          echo "all non-merge commits in this PR match Conventional Commits format"

  # Proves the docs site actually builds before it can reach docs.yml, which only
  # runs after an irreversible nuget publish - a bad docfx.json edit or doc-comment
  # regression should fail here, not surface after release.
  # Keeps the tree matching .editorconfig. Cheap: measured 2026-08-08, the whole solution had
  # exactly three whitespace deviations, all in one file, and one was a genuinely misaligned comment
  # continuation rather than a stylistic quibble.
  #
  # `dotnet format` is NOT the same lever as AnalysisMode, and conflating them would be expensive.
  # Raising AnalysisMode to Recommended is 1622 warnings on this tree - 1400 of them CA1707 against
  # the deliberate Method_Behaviour test names (see CLAUDE.md). This job is whitespace and the
  # .editorconfig rules only.
  format:
    name: formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.302
          # Same cache as the build & test job above; see that block for the measured
          # effect and for why this does not disarm the samples' Version="*" canary.
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Three READMEs were kept in sync by hand, and on 2026-08-08 that failed six times in one
      # day - every consumer-facing addition landed on the ROOT readme while
      # src/DocToolkit/README.md, the one nuget.org actually renders, went untouched. It
      # surfaced by accident. It then happened again the next day to the extensions README.
      #
      # Cheap to run and needs no build: the public types come from the approved API files,
      # which are already the reviewed source of truth for what ships.
      - name: Assert every shipped type is named in its package README
        run: python3 scripts/check-readme-coverage.py

      # The guides carry no code of their own - every block is a #region pulled out of a project
      # in samples/, which the build job compiles with -warnaserror on four platforms. So a guide
      # cannot document an API that no longer exists.
      #
      # That only holds while the region references resolve, and docfx does NOT enforce it.
      # Measured 2026-08-09: pointing a snippet at a region that does not exist produced exit
      # code 0, no warning, and an empty <code> block under prose describing its contents.
      # --warningsAsErrors catches a dead LINK but not a dead SNIPPET. This is that check.
      # A Dependabot ignore rule is scoped to the block that declares it - nothing is
      # inherited. On 2026-08-03 a grouped run from the /tests/ block proposed
      # SixLabors.Fonts [1.0.0] -> [3.0.0], past the revenue-gated 2.x line the pin exists
      # to prevent, plus three shipped floors ignored in their own blocks: the test
      # projects reach src/ through ProjectReference and Dependabot edits those csproj
      # files, where the other blocks' rules do not apply.
      #
      # The fix was to repeat the rules, and the backlog said the rest out loud - a test
      # asserting that would be better than a comment. The required set is DERIVED from
      # what the src/ blocks declare, so a new pin becomes mandatory everywhere else on
      # its own.
      # release.yml gained an SBOM step using a LOCAL tool and did not gain the
      # `dotnet tool restore` that makes the command exist on a runner. Both v0.17.0
      # release runs failed and that version never reached nuget.org. It passed review
      # because the command was dry-run on a machine where the tool was already
      # installed - the one environment CI is not.
      - name: Assert every workflow using a local tool restores it
        run: python3 scripts/check-workflow-tools.py

      - name: Assert Dependabot blocks repeat the rules protecting src/
        run: python3 scripts/check-dependabot-scoping.py

      - name: Assert every guide snippet resolves to a real region
        run: python3 scripts/check-doc-snippets.py

      - name: Assert the tree matches .editorconfig
        run: |
          if ! dotnet format ${{ env.SOLUTION }} --verify-no-changes; then
            echo "::error::Formatting does not match .editorconfig. Run 'dotnet format ${{ env.SOLUTION }}' and commit the result."
            exit 1
          fi

  docs-build:
    name: build docs site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.302
          # Same cache as the build & test job above; see that block for the measured
          # effect and for why this does not disarm the samples' Version="*" canary.
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # The version lives in .config/dotnet-tools.json, not here. It used to be written
      # in this file AND in the other workflow, with nothing keeping the two in step.
      - name: Restore local tools
        run: dotnet tool restore

      # --warningsAsErrors catches a regression like the InvalidFileLink warning
      # this pipeline hit once already (see docfx/index.md's xref: links).
      - name: Build docs site
        run: dotnet docfx docfx/docfx.json --warningsAsErrors

  # Proves the artifacts consumers actually install are correct - not just that
  # the solution compiles. Catches missing TFMs and metadata regressions.
  package:
    name: pack & verify .nupkg (${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            project: src/DocToolkit/DocToolkit.csproj
            deps: "DocumentFormat.OpenXml,HtmlToOpenXml.dll,OfficeIMO.Word.Pdf,ClosedXML"
          - name: extensions
            project: src/DocToolkit.Extensions.DependencyInjection/DocToolkit.Extensions.DependencyInjection.csproj
            deps: "Ank.DocToolkit,Microsoft.Extensions.DependencyInjection.Abstractions,Microsoft.Extensions.Options"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.302
          # Same cache as the build & test job above; see that block for the measured
          # effect and for why this does not disarm the samples' Version="*" canary.
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Pack
        run: dotnet pack ${{ matrix.project }} -c Release

      - name: Verify package contents
        env:
          EXPECTED_DEPS: ${{ matrix.deps }}
        run: |
          python3 - <<'PY'
          import glob, os, sys, zipfile
          deps = os.environ['EXPECTED_DEPS'].split(',')
          hits = glob.glob('artifacts/*.nupkg')
          if not hits:
              sys.exit('no .nupkg produced')
          pkg = hits[0]
          print('package:', pkg)
          z = zipfile.ZipFile(pkg)
          names = z.namelist()
          nuspec = z.read([n for n in names if n.endswith('.nuspec')][0]).decode('utf-8')

          failures = []
          for required in ['README.md', 'THIRD-PARTY-NOTICES.txt']:
              ok = required in names
              print(('OK   ' if ok else 'MISS ') + required)
              if not ok:
                  failures.append(required)

          has_net8 = any(n.startswith('lib/net8.0/') for n in names)
          has_net10 = any(n.startswith('lib/net10.0/') for n in names)
          print(('OK   ' if has_net8 else 'MISS ') + 'lib/net8.0/')
          print(('OK   ' if has_net10 else 'MISS ') + 'lib/net10.0/')
          if not has_net8: failures.append('lib/net8.0/')
          if not has_net10: failures.append('lib/net10.0/')

          for dep in deps:
              ok = dep in nuspec
              print(('OK   dep ' if ok else 'MISS dep ') + dep)
              if not ok:
                  failures.append('dep ' + dep)

          if '<license type="expression">MIT' not in nuspec:
              failures.append('MIT licence expression')
          if any(n.startswith('runtimes/') for n in names):
              failures.append('runtimes/ present - native payload in package')

          if failures:
              sys.exit('package verification failed: ' + ', '.join(failures))
          print('\npackage verified')
          PY

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-${{ matrix.name }}
          path: artifacts/*.nupkg
          if-no-files-found: error
