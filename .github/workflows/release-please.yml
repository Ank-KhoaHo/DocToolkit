name: release-please

# Maintains a persistent "Release PR" on main: as commits land in Conventional Commits
# format, this computes the next version and writes the CHANGELOG.md entry.
#
# Merging that PR is a HUMAN decision, and the only thing that publishes. This workflow
# never merges it - it only reports that one is waiting. Several merges to main therefore
# accumulate into a single release, which is the point: an auto-merging version of this
# shipped eleven versions in one day, most of them carrying no library change.
#
# The publish itself re-proves every guard in release.yml before pushing to nuget.org,
# which is irreversible. See release-please-config.json for the version/changelog rules,
# The Release PR is merged by hand; nothing else publishes.
#
# Requires a Personal Access Token, not the default GITHUB_TOKEN: GitHub Actions does not
# let a workflow's default token trigger OTHER workflows when it pushes a commit or tag
# (loop prevention). Using the default token here would mean the tag this action pushes on
# Release-PR merge never reaches release.yml's `push: tags: ["v*"]` trigger - no error,
# the tag would just sit there unpublished.
#
# Setup, once: create a fine-grained PAT scoped to only this repo, with
# "Contents: read and write" and "Pull requests: read and write" permissions, and add it as
# a repository secret named RELEASE_PLEASE_TOKEN. Fine-grained PATs expire - rotate it
# before it does, or releases silently stop triggering.
#
# Does NOT set skip-github-release in release-please-config.json - release-please's own docs
# are explicit that skipping the GitHub Release also skips creating the tag, unless you build
# separate tagging infrastructure. release.yml's own "Create or update GitHub Release" step
# handles the resulting release-already-exists case instead of colliding with it.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Fail early if RELEASE_PLEASE_TOKEN is missing
        run: |
          if [ -z "${{ secrets.RELEASE_PLEASE_TOKEN }}" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set. Add a fine-grained PAT (Contents: read and write, Pull requests: read and write, scoped to this repo) as a repository secret - see this file's header comment."
            exit 1
          fi
          echo "RELEASE_PLEASE_TOKEN is configured"

      # Needed by the notes-sync step below, which reads CHANGELOG.md. Checking out BEFORE
      # release-please runs is deliberate and load-bearing: this workflow is triggered by the
      # push that merged the Release PR, so main at this SHA already carries the CURATED
      # changelog. Checking out afterwards would race release-please's own commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # CURATING THE RELEASE PR FIXES CHANGELOG.md AND NOT THE PUBLISHED RELEASE NOTES.
      #
      # release-please builds the GitHub Release body from the COMMITS at release time,
      # independently of the changelog file it also writes. So the two diverge the moment
      # anybody edits one. Measured 2026-08-15 on v0.27.2: the curated entry landed in the
      # repository while the Release page still showed the generated text, including a
      # duplicate line the curation had removed. It was corrected by hand, which only worked
      # because somebody happened to look.
      #
      # The changelog is the curated source, so the Release body is DERIVED from it - the same
      # move as gen-third-party-notices.py reading the lockfile. One curated source, both
      # surfaces, and no checklist item that has to be remembered.
      #
      # Fails loudly rather than quietly leaving them out of step: the extractor refuses to
      # emit an empty or heading-only section, so a Release body can never be blanked by a
      # parser that stopped matching. Nothing is published by this workflow - release.yml
      # publishes on the tag - so a red run here costs a re-run, not a bad release.
      - name: Sync the Release notes from the curated CHANGELOG
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          python3 scripts/extract-changelog-section.py "$TAG" > /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md
          echo "Release notes for $TAG now match the curated CHANGELOG.md entry"
          {
            echo "### Release notes synced"
            echo ""
            echo "\`$TAG\`'s GitHub Release body was replaced with the curated \`CHANGELOG.md\` section."
          } >> "$GITHUB_STEP_SUMMARY"

      # Reports the Release PR. Deliberately does NOT merge it.
      #
      # This workflow briefly auto-merged the Release PR, making every merge to
      # main publish. It worked exactly as designed and the result was eleven
      # versions in a day, most carrying no library change at all - a docs fix
      # and a CI tweak each burned a version number that can never be reused,
      # because a nuget.org version can be unlisted but never deleted. Merging
      # the Release PR by hand batches several merges into one release, which is
      # what the version number is for.
      #
      # The lookup stays because it is the only thing that can tell "nothing to
      # release" apart from "the branch-naming convention changed underneath
      # us". Those need opposite responses, and guessing wrong is the failure
      # that stops releases while every step still reports success - which has
      # happened here once already, a Release PR sitting unmerged and unnoticed
      # with nothing red anywhere.
      #
      # So the action's own `pr` output is used as a CORROBORATOR, not a source:
      # if release-please says it opened or updated a Release PR and the branch
      # lookup then finds none, that is a real error and this fails loudly.
      - name: Report the Release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PLEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          number=$(gh pr list --base main --head release-please--branches--main \
            --state open --json number --jq '.[0].number // empty')

          if [ -z "$number" ]; then
            if [ -n "$RELEASE_PLEASE_PR" ] && [ "$RELEASE_PLEASE_PR" != "null" ]; then
              echo "::error::release-please reported a Release PR, but no open PR was found on branch 'release-please--branches--main'. The branch-naming convention this lookup hard-codes has probably changed. Releases are STOPPED until it is corrected - do not treat this as 'nothing to release'."
              exit 1
            fi
            echo "no open Release PR, and release-please reported none - every commit is already released"
            exit 0
          fi

          title=$(gh pr view "$number" --json title --jq .title)
          echo "Release PR #$number is open and waiting to be merged: $title"

          # THE CHECKLIST GOES ON THE PULL REQUEST, not only in the run summary.
          #
          # This prompt already existed and went solely to $GITHUB_STEP_SUMMARY - a page nobody
          # opens at the moment they press Merge. So it was written, correct, and invisible,
          # which is indistinguishable from absent: 0.27.0 shipped uncurated anyway.
          #
          # The text lives in .github/release-curation-checklist.md rather than inline here, so
          # it can be reviewed and edited without touching YAML quoting, and so the hidden
          # marker on its first line stays next to the content it identifies.
          #
          # Posted ONCE, not per run. This workflow fires on every push to main, so an
          # unconditional `gh pr comment` would leave one copy per merge and turn the checklist
          # into the noise it exists to cut through. The marker is how an existing one is found.
          marker='<!-- release-curation-checklist -->'
          if gh pr view "$number" --json comments                --jq '.comments[].body' | grep -qF "$marker"; then
            echo "curation checklist already on #$number - not repeating it"
          else
            gh pr comment "$number" --body-file .github/release-curation-checklist.md
            echo "posted the curation checklist to #$number"
          fi

          {
            echo "### Release PR #$number is waiting"
            echo ""
            echo "\`$title\`"
            echo ""
            echo "Merging it tags the version and publishes both packages to nuget.org, which is"
            echo "irreversible. Check the changelog entry in its diff first - a bump whose entry is"
            echo "empty is a signal to let more changes accumulate rather than release now."
            echo ""
            echo "**Does anything in this release CHANGE existing behaviour?**"
            echo ""
            echo "release-please files every feat: commit under **Added**, which reads as a new"
            echo "capability. A changed default, a different output, or a new exception from a"
            echo "call that used to succeed is none of those - and a consumer upgrading will not"
            echo "learn about it from an Added line."
            echo ""
            echo "If so, edit this PR entry to say so under **Changed**, with the one-line"
            echo "migration, BEFORE merging. It cannot be added afterwards: a published version"
            echo "can be unlisted but never edited."
            echo ""
            echo "This is not hypothetical - it happened in 0.13.0. Generated documents changed"
            echo "from whatever the reader template chose to A4, and the entry said only"
            echo "defaulting to A4, filed under Added."
          } >> "$GITHUB_STEP_SUMMARY"

          # The curation STATE is reported by release-curation-state.yml, not here.
          #
          # It lived in this step and was wrong for a specific reason worth keeping: this workflow
          # triggers on push to `main`, and curating means pushing to the RELEASE BRANCH. So the
          # comment kept whatever it said when the entry was last regenerated - "NOTHING HAS BEEN
          # CURATED" - and was therefore wrong at exactly the moment somebody reads it, on a
          # curated Release PR immediately before merging. Measured 2026-08-18 on 0.31.0.
          #
          # The two have genuinely different triggers, which is why bundling them produced that:
          # this workflow regenerates the entry, and the entry's state changes elsewhere.
