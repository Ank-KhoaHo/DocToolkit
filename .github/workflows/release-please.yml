name: release-please

# Maintains a persistent "Release PR" on main: as commits land in Conventional Commits
# format, this computes the next version and writes the CHANGELOG.md entry.
#
# Merging that PR is automatic (see the Auto-merge step below): every merge to main
# produces a release. The publish itself still re-proves every guard in release.yml
# before pushing to nuget.org, which is irreversible. See release-please-config.json
# for the version/changelog rules, and CLAUDE.md's "Releasing" section for the full flow.
#
# Requires a Personal Access Token, not the default GITHUB_TOKEN: GitHub Actions does not
# let a workflow's default token trigger OTHER workflows when it pushes a commit or tag
# (loop prevention). Using the default token here would mean the tag this action pushes on
# Release-PR merge never reaches release.yml's `push: tags: ["v*"]` trigger - no error,
# the tag would just sit there unpublished.
#
# Setup, once: create a fine-grained PAT scoped to only this repo, with
# "Contents: read and write" and "Pull requests: read and write" permissions, and add it as
# a repository secret named RELEASE_PLEASE_TOKEN. Fine-grained PATs expire - rotate it
# before it does, or releases silently stop triggering.
#
# Does NOT set skip-github-release in release-please-config.json - release-please's own docs
# are explicit that skipping the GitHub Release also skips creating the tag, unless you build
# separate tagging infrastructure. release.yml's own "Create or update GitHub Release" step
# handles the resulting release-already-exists case instead of colliding with it.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Fail early if RELEASE_PLEASE_TOKEN is missing
        run: |
          if [ -z "${{ secrets.RELEASE_PLEASE_TOKEN }}" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set. Add a fine-grained PAT (Contents: read and write, Pull requests: read and write, scoped to this repo) as a repository secret - see this file's header comment."
            exit 1
          fi
          echo "RELEASE_PLEASE_TOKEN is configured"

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # Requirement: every merge to main produces a release, with no human gate.
      # Requirement: main cannot be pushed directly.
      #
      # Auto-merging the Release PR satisfies both - the bot merges a PULL
      # REQUEST, so branch protection holds with no bypass actor and no
      # long-lived token with push rights.
      #
      # Finds the PR by its branch rather than by parsing this action's outputs,
      # so an output-schema change upstream cannot silently stop releases.
      #
      # But "found nothing" is ambiguous on its own: it means either that every
      # commit is already released, or that the branch-naming convention this
      # lookup hard-codes has changed underneath us. Those need opposite
      # responses, and guessing wrong is the one failure that stops releases
      # while every step still reports success.
      #
      # So the action's own `pr` output is used as a CORROBORATOR, not a source:
      # if release-please says it opened or updated a Release PR and the branch
      # lookup then finds none, that is a real error and this fails loudly.
      # Verified the hard way - a Release PR sat unmerged and unnoticed once
      # already, stalled by a branch-protection setting, with nothing red
      # anywhere to show for it.
      #
      # NOTE: if branch protection on main ever requires APPROVING REVIEWS, this
      # can never succeed - an unattended bot cannot approve - and releases stop.
      # Require status checks, not reviews.
      - name: Auto-merge the Release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PLEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          number=$(gh pr list --base main --head release-please--branches--main \
            --state open --json number --jq '.[0].number // empty')

          if [ -z "$number" ]; then
            if [ -n "$RELEASE_PLEASE_PR" ] && [ "$RELEASE_PLEASE_PR" != "null" ]; then
              echo "::error::release-please reported a Release PR, but no open PR was found on branch 'release-please--branches--main'. The branch-naming convention this step relies on has probably changed. Releases are STOPPED until this lookup is corrected - do not treat this as 'nothing to release'."
              exit 1
            fi
            echo "no open Release PR, and release-please reported none - every commit is already released"
            exit 0
          fi

          echo "enabling auto-merge on Release PR #$number"
          gh pr merge "$number" --merge --auto
