name: release-please

# Maintains a persistent "Release PR" on main: as commits land in Conventional Commits
# format, this computes the next version and writes the CHANGELOG.md entry.
#
# Merging that PR is a HUMAN decision, and the only thing that publishes. This workflow
# never merges it - it only reports that one is waiting. Several merges to main therefore
# accumulate into a single release, which is the point: an auto-merging version of this
# shipped eleven versions in one day, most of them carrying no library change.
#
# The publish itself re-proves every guard in release.yml before pushing to nuget.org,
# which is irreversible. See release-please-config.json for the version/changelog rules,
# and CLAUDE.md's "Releasing" section for the full flow.
#
# Requires a Personal Access Token, not the default GITHUB_TOKEN: GitHub Actions does not
# let a workflow's default token trigger OTHER workflows when it pushes a commit or tag
# (loop prevention). Using the default token here would mean the tag this action pushes on
# Release-PR merge never reaches release.yml's `push: tags: ["v*"]` trigger - no error,
# the tag would just sit there unpublished.
#
# Setup, once: create a fine-grained PAT scoped to only this repo, with
# "Contents: read and write" and "Pull requests: read and write" permissions, and add it as
# a repository secret named RELEASE_PLEASE_TOKEN. Fine-grained PATs expire - rotate it
# before it does, or releases silently stop triggering.
#
# Does NOT set skip-github-release in release-please-config.json - release-please's own docs
# are explicit that skipping the GitHub Release also skips creating the tag, unless you build
# separate tagging infrastructure. release.yml's own "Create or update GitHub Release" step
# handles the resulting release-already-exists case instead of colliding with it.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Fail early if RELEASE_PLEASE_TOKEN is missing
        run: |
          if [ -z "${{ secrets.RELEASE_PLEASE_TOKEN }}" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set. Add a fine-grained PAT (Contents: read and write, Pull requests: read and write, scoped to this repo) as a repository secret - see this file's header comment."
            exit 1
          fi
          echo "RELEASE_PLEASE_TOKEN is configured"

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # Reports the Release PR. Deliberately does NOT merge it.
      #
      # This workflow briefly auto-merged the Release PR, making every merge to
      # main publish. It worked exactly as designed and the result was eleven
      # versions in a day, most carrying no library change at all - a docs fix
      # and a CI tweak each burned a version number that can never be reused,
      # because a nuget.org version can be unlisted but never deleted. Merging
      # the Release PR by hand batches several merges into one release, which is
      # what the version number is for.
      #
      # The lookup stays because it is the only thing that can tell "nothing to
      # release" apart from "the branch-naming convention changed underneath
      # us". Those need opposite responses, and guessing wrong is the failure
      # that stops releases while every step still reports success - which has
      # happened here once already, a Release PR sitting unmerged and unnoticed
      # with nothing red anywhere.
      #
      # So the action's own `pr` output is used as a CORROBORATOR, not a source:
      # if release-please says it opened or updated a Release PR and the branch
      # lookup then finds none, that is a real error and this fails loudly.
      - name: Report the Release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PLEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          number=$(gh pr list --base main --head release-please--branches--main \
            --state open --json number --jq '.[0].number // empty')

          if [ -z "$number" ]; then
            if [ -n "$RELEASE_PLEASE_PR" ] && [ "$RELEASE_PLEASE_PR" != "null" ]; then
              echo "::error::release-please reported a Release PR, but no open PR was found on branch 'release-please--branches--main'. The branch-naming convention this lookup hard-codes has probably changed. Releases are STOPPED until it is corrected - do not treat this as 'nothing to release'."
              exit 1
            fi
            echo "no open Release PR, and release-please reported none - every commit is already released"
            exit 0
          fi

          title=$(gh pr view "$number" --json title --jq .title)
          echo "Release PR #$number is open and waiting to be merged: $title"
          {
            echo "### Release PR #$number is waiting"
            echo ""
            echo "\`$title\`"
            echo ""
            echo "Merging it tags the version and publishes both packages to nuget.org, which is"
            echo "irreversible. Check the changelog entry in its diff first - a bump whose entry is"
            echo "empty is a signal to let more changes accumulate rather than release now."
          } >> "$GITHUB_STEP_SUMMARY"
