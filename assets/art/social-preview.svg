<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Segoe UI', Inter, sans-serif">
  <!-- F21 social preview (GitHub link card). Source for social-preview.png; the maintainer uploads
       the PNG under Settings > General > Social preview, since GitHub has no API for it (F20).
       The page is REAL output: invoice-page.png is what HtmlToPdfConverter.ConvertAsync made from
       invoice.html, rasterised at 220 dpi and cropped (PyMuPDF, outside this repository). Headlines
       are Bahnschrift, which ships with Windows, so render on Windows. -->
<defs>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1B2A4E" flood-opacity="0.18"/>
  </filter>
  <clipPath id="frame"><rect width="1280" height="640" rx="0"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1280" height="640" fill="#E8EDF4"/>
<g transform="translate(80 64) scale(0.5)"><rect width="128" height="128" rx="26" fill="#1B2A4E"/>
<rect x="34" y="20" width="60" height="88" rx="6" fill="#FFFFFF"/>
<path d="M78 20 H88 a6 6 0 0 1 6 6 V36 Z" fill="#C6D4E8"/>
<path d="M50 52 H86 V60 H44 Z" fill="#3D7EBF"/><path d="M48 66 H86 V74 H42 Z" fill="#3D7EBF"/>
<rect x="42" y="82" width="22" height="8" fill="#F0B429"/></g>
<text x="160" y="112" fill="#1B2A4E" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="36" font-weight="600">DocToolkit</text>
<text x="80" y="262" fill="#1B2A4E" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="64" font-weight="600" letter-spacing="-1">HTML in.</text>
<text x="80" y="336" fill="#1B2A4E" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="64" font-weight="600" letter-spacing="-1">Word and PDF out.</text>
<text x="82" y="392" fill="#4A5A78" font-size="22">One NuGet package. No browser, no native binaries.</text>
<rect x="80" y="440" width="470" height="52" rx="8" fill="#1B2A4E"/>
<text x="102" y="474" fill="#FFFFFF" font-family="'Cascadia Mono', Consolas, monospace" font-size="22">dotnet add package Ank.DocToolkit</text>
<rect x="690" y="170" width="536" height="221" fill="#FFFFFF" filter="url(#soft)"/>
<image href="invoice-page.png" x="708" y="188" width="500" height="185"/>
<path d="M678 170 h-28 M690 158 v-28" stroke="#7F93B8" stroke-width="1.4"/>
<path d="M678 391 h-28 M690 403 v28" stroke="#7F93B8" stroke-width="1.4"/>
<path d="M1238 170 h28 M1226 158 v-28" stroke="#7F93B8" stroke-width="1.4"/>
<path d="M1238 391 h28 M1226 403 v28" stroke="#7F93B8" stroke-width="1.4"/>
<circle cx="958" cy="128" r="9" fill="none" stroke="#7F93B8" stroke-width="1.4"/><path d="M943 128 h30 M958 113 v30" stroke="#7F93B8" stroke-width="1.4"/>
<text x="730" y="431" fill="#4A5A78" font-size="16">invoice.pdf, made by DocToolkit from invoice.html</text>
</g>
</svg>
